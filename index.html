<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121824">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700&family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Tajawal','system-ui','sans-serif']},
 colors:{bg:'rgb(var(--bg) / <alpha-value>)',card:'rgb(var(--card) / <alpha-value>)',line:'rgb(var(--line) / <alpha-value>)',mute:'#8b97ad',ok:'#22c55e',warn:'#f59e0b',bad:'#ef4444',acc:'rgb(var(--acc) / <alpha-value>)'}}}}
</script>
<style>
:root{--bg:18 24 36;--card:26 34 51;--line:39 49 72;--acc:79 140 255;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:rgb(var(--bg))}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgb(var(--bg));z-index:40}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #4f8cff;outline-offset:2px}
@keyframes up{from{transform:translateY(50%);opacity:.5}}.up{animation:up .22s}
.sens{transition:filter .2s}body.priv .sens{filter:blur(7px);user-select:none;pointer-events:none}
@media print{header,nav,#sync,#toast,#sheet,.np{display:none!important}html,body{background:#fff!important}*{color:#000!important;background:transparent!important;border-color:#999!important}main{padding-bottom:0!important}}#pz{display:none}.lc2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}body.ro:not(.ratt) [data-ba],body.ro:not(.ratt) [data-st],body.ro:not(.ratt) [data-a="allp"],body.ro [data-a="close"],body.ro [data-a="reopen"],body.ro [data-a="mdel"],body.ro [data-a="medit"],body.ro [data-lc="add"],body.ro [data-lc="edit"],body.ro [data-lc="del"],body.ro [data-lc="who"]{display:none!important}
html.light{color-scheme:light}html.light body{color:#0f172a}html.light .text-slate-100{color:#0f172a}html.light .text-slate-200,html.light .text-slate-300{color:#334155}html.light [class*=bg-gradient],html.light [class*=bg-gradient] *{color:#fff}html.light .bg-black\/60,html.light .bg-black\/70{background:rgba(15,23,42,.45)}@media print{body.pz-on>*:not(#pz){display:none!important}body.pz-on #pz{display:block!important}}
@media (prefers-reduced-motion:reduce){.up{animation:none}}
</style>
</head>
<body class="font-sans text-slate-100 bg-bg min-h-screen">
<header class="sticky top-[env(safe-area-inset-top,0px)] z-30 bg-bg/95 backdrop-blur border-b border-line">
 <div class="max-w-md mx-auto px-4 py-3 flex items-center gap-3" id="hd"></div>
</header>
<div id="sync" class="max-w-md mx-auto px-4 pt-2 text-[11px]"></div>
<main id="app" class="max-w-md mx-auto px-4 pt-2 pb-36"></main>

<nav class="fixed inset-x-3 bottom-[calc(12px+env(safe-area-inset-bottom,0px))] z-30 max-w-md mx-auto bg-[#0c111b] border border-line rounded-3xl p-2 flex shadow-2xl shadow-black/60" aria-label="التنقل" id="nav"></nav>
<div id="sheet" class="fixed inset-0 z-50 bg-black/60 hidden"><div id="sb" class="up absolute bottom-0 inset-x-0 max-w-md mx-auto bg-card rounded-t-3xl p-5 pb-[calc(24px+env(safe-area-inset-bottom,0px))]"></div></div>
<div id="toast" class="fixed top-[calc(70px+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 bg-slate-100 text-bg text-sm px-4 py-2 rounded-xl z-[60] opacity-0 transition-opacity pointer-events-none"></div>

<script>
/* ========== helpers ========== */
const $=s=>document.querySelector(s),
 esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
 hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),
 toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)};
const KEY='mina_p1';
/* ========== state (localStorage مع try/catch — بدّله بـ Firestore في الجزء ٢) ========== */
function seed(){
 const sv=[['s1','ابتدائي'],['s2','إعدادي'],['s3','اجتماع شباب']];
 const N=[['مينا عادل','s1'],['مريم سمير','s1'],['بيشوي ماهر','s1'],['كيرلس جورج','s1'],['مارتينا أيمن','s2'],['يوسف نبيل','s2'],['ماريا رأفت','s2'],['أنطونيوس هاني','s3'],['دميانة وائل','s3'],['مارك سامح','s3']];
 return{seq:N.length+1,services:sv.map(([id,name])=>({id,name})),
  members:N.map(([name,sid],i)=>({id:'MN-'+String(i+1).padStart(4,'0'),name,sid,phone:'0100'+String(1234567+i*91137).slice(0,7),
   att:Array.from({length:12},(_,w)=>((hash(name)+w*7)%10)/10<[.9,.8,.5,.2][i%4]?1:0)}))}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(_){}S=S||seed();
/* ===== أوفلاين أولًا: كل شيء يُحفظ محليًا فورًا، والمزامنة السحابية تتم لما يرجع النت =====
   FB.push: وصّل هنا Firestore الحقيقي (خارج هذه المعاينة):
   FB.push = snap => setDoc(doc(db,'orgs','main'), snap)   // لاحقًا: مستند لكل مجموعة (members / sessions / notes / reports) */
const FB={push:null};
const save=()=>{if(window.RO){if(window.RATT&&sigOf()===window.__sig){attPush();return}toast('وضع العرض فقط — لا يمكن التعديل');setTimeout(()=>location.reload(),900);return}S.dirty=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}updSync();sync()};
async function sync(){if(window.RO||!navigator.onLine||!S.dirty||!FB.push||sync.b)return;sync.b=1;
 try{await FB.push(JSON.parse(JSON.stringify(S)));S.dirty=false;localStorage.setItem(KEY,JSON.stringify(S));toast('تمت المزامنة')}catch(_){}sync.b=0;updSync()}
function updSync(){const e=$('#sync');if(!e)return;const on=navigator.onLine;
 e.className='max-w-md mx-auto px-4 pt-2 text-[11px]';
 e.innerHTML=`<div class="flex items-center justify-between mb-1.5">${roleChip()}<span class="text-mute truncate max-w-[55%]" dir="ltr">${esc(whoAmI())}</span></div><div class="flex items-center justify-between"><button data-a="priv" class="px-2.5 py-0.5 rounded-full border ${S.priv?'border-acc text-acc bg-acc/10':'border-line text-mute'}">${S.priv?'🙈 الخصوصية مفعّلة':'👁 وضع الخصوصية'}</button><span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full ${on?'bg-ok/15 text-ok':'bg-warn/15 text-warn'}"><i class="w-1.5 h-1.5 rounded-full ${on?'bg-ok':'bg-warn'}"></i>${on?'متصل':'بدون إنترنت'} · ${S.dirty&&FB.push?'بانتظار المزامنة':'محفوظ على الجهاز'}</span></div>`}
addEventListener('online',()=>{updSync();sync()});addEventListener('offline',updSync);
let ui={tab:'home',sub:null,q:'',f:'all'};

/* ========== derived ========== */
const countOf=sid=>S.members.filter(m=>m.sid===sid).length;               // live member count
const pct=m=>m.att.length?Math.round(m.att.reduce((a,b)=>a+b,0)/m.att.length*100):null;
const tone=p=>p===null?['text-mute','bg-line']:p>=75?['text-ok','bg-ok']:p>=50?['text-warn','bg-warn']:['text-bad','bg-bad'];
const svcName=id=>S.services.find(s=>s.id===id)?.name||'—';
function wa(ph){let n=String(ph||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('0'))n='20'+n.slice(1);return 'https://wa.me/'+n}

/* ========== components ========== */
const G=[['#4f8cff','#2b5cc7'],['#f59e0b','#b45309'],['#22c55e','#15803d'],['#a855f7','#6d28d9'],['#f97316','#c2410c'],['#06b6d4','#0e7490']];
const avatar=m=>{const[a,b]=G[hash(m.name)%6];return `<div class="w-12 h-12 rounded-full grid place-items-center font-extrabold text-lg text-white shrink-0" style="${m.photo?`background:url('${m.photo.replace(/["'()\s\\]/g,c=>'%'+c.charCodeAt(0).toString(16))}') center/cover`:`background:linear-gradient(135deg,${a},${b})`}">${m.photo?'':esc(m.name.trim()[0])}</div>`};
const ICON={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 att:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 12l3 3 5-6"/>',
 mem:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.4 3.5 6"/>',
 ntf:'<path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/>',
 more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
 call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>',
 back:'<path d="M9 6l6 6-6 6"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const ic=(k,c='w-6 h-6')=>`<svg viewBox="0 0 24 24" class="${c}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
const TABS=[['home','اليوم','home'],['att','الحضور','att'],['mem','المخدومين','mem'],['ntf','التنبيهات','ntf'],['more','المزيد','more']];
const soon=t=>`<div class="mt-16 text-center text-mute"><div class="mx-auto w-16 h-16 rounded-2xl bg-card border border-line grid place-items-center text-acc mb-4">${ic(TABS.find(x=>x[0]===ui.tab)[2],'w-8 h-8')}</div><div class="text-slate-100 font-bold text-lg">${t}</div><p class="text-sm mt-1">تُبنى في الجزء الثاني</p></div>`;

/* ========== screens ========== */
function vMembers(){
 const l=S.members.filter(m=>(ui.f==='all'||m.sid===ui.f)&&(m.name.includes(ui.q)||m.id.toLowerCase().includes(ui.q.toLowerCase()))&&fxOk(m));
 return `<div class="relative"><input id="q" type="search" value="${esc(ui.q)}" placeholder="ابحث بالاسم أو الكود" class="w-full bg-card border border-line rounded-2xl py-3 ps-4 pe-4 placeholder:text-mute"></div>
 ${fxChips()}
  <div class="flex gap-2 overflow-x-auto py-3 -mx-4 px-4">${[['all','الكل',S.members.length],...S.services.map(s=>[s.id,s.name,countOf(s.id)])].map(([id,n,c])=>
  `<button data-f="${id}" class="shrink-0 px-4 py-1.5 rounded-full text-sm border ${ui.f===id?'bg-acc border-acc text-white font-bold':'border-line text-mute bg-card'}">${esc(n)} · ${c}</button>`).join('')}</div>
 <div class="space-y-3">${l.map(m=>{const p=pct(m),[t,b]=tone(p);return `
  <article class="bg-card border border-line rounded-2xl p-3 flex items-center gap-3">${avatar(m)}
   <div data-m="${m.id}" class="min-w-0 flex-1 cursor-pointer"><div class="font-bold truncate">${esc(m.name)}${(S.notes[m.id]||[]).length?' 📝':''}</div>
    <div class="text-xs text-mute flex gap-2 items-center"><span dir="ltr" class="font-mono">${m.id}</span><span>·</span><span>${esc(svcName(m.sid))}</span></div>
    <div class="flex items-center gap-2 mt-1.5"><div class="h-1.5 flex-1 rounded-full bg-line overflow-hidden"><div class="h-full ${b}" style="width:${p??0}%"></div></div><span class="text-xs font-bold ${t}">${p===null?'—':p+'%'}</span></div></div>
   <div class="flex flex-col gap-2">
    <a href="tel:${esc(m.phone)}" aria-label="اتصال بـ ${esc(m.name)}" class="w-10 h-10 grid place-items-center rounded-xl bg-acc/15 text-acc ${m.phone?'':'opacity-30 pointer-events-none'}">${ic('call','w-5 h-5')}</a>
    <a href="${wa(m.phone)}" target="_blank" rel="noopener" aria-label="واتساب ${esc(m.name)}" class="w-10 h-10 grid place-items-center rounded-xl bg-ok/15 text-ok ${m.phone?'':'opacity-30 pointer-events-none'}">${ic('chat','w-5 h-5')}</a></div>
  </article>`}).join('')||'<p class="text-center text-mute py-10">لا يوجد نتائج</p>'}</div>`}

function vMore(){
 if(ui.sub==='plan')return vPlan();
 const sv4={bd:vBd,fu:vFu,help:vHelp,srv:vSrv,wk:vWk,pts:vPts,set:vSet,hist:vHist,month:vMonth,sup:vSup,nset:vNset,bak:vBak,lect:vLect,print:vPrint,team:vTeam,qr:vQR,year:vYear,fplan:vFplan,cal:vCal,visits:vVisits,imp:vImp,promo:vPromo,renew:vRenew,svc:vSvc,adm:vAdm,early:vEarly,guests:vGuests,trips:vTrips,contest:vContest,smeet:vSmeet,log:vLog,brand:vBrand,mpdf:vMpdf,sermon:vSermon,gwa:vGwa,word:vWord}[ui.sub];if(sv4)return sv4();
 if(ui.sub==='services')return `
  <div class="bg-card border border-line rounded-2xl p-3 flex gap-2"><input id="ns" placeholder="اسم مرحلة أو اجتماع جديد" class="flex-1 bg-bg border border-line rounded-xl px-3 py-2.5 placeholder:text-mute"><button id="adds" class="bg-acc text-white font-bold rounded-xl px-4 flex items-center gap-1">${ic('plus','w-4 h-4')}إضافة</button></div>
  <div class="space-y-3 mt-4">${S.services.map(s=>{const c=countOf(s.id),ms=S.members.filter(m=>m.sid===s.id),av=ms.map(pct).filter(x=>x!==null),a=av.length?Math.round(av.reduce((x,y)=>x+y,0)/av.length):null,[t]=tone(a);return `
   <div class="bg-card border border-line rounded-2xl p-4 flex items-center gap-3">
    <div class="w-11 h-11 rounded-xl bg-acc/15 text-acc grid place-items-center">${ic('mem','w-6 h-6')}</div>
    <div class="flex-1 min-w-0"><div class="font-bold">${esc(s.name)}</div><div class="text-xs text-mute"><span class="text-slate-100 font-bold">${c}</span> مخدوم${a!==null?` · متوسط الحضور <span class="${t} font-bold">${a}%</span>`:''}</div></div>
    <button data-open="${s.id}" class="text-xs text-acc border border-acc/40 rounded-lg px-2.5 py-1.5">عرض</button>
    <button data-del="${s.id}" aria-label="حذف ${esc(s.name)}" class="w-9 h-9 grid place-items-center rounded-lg text-bad bg-bad/10">${ic('trash','w-5 h-5')}</button></div>`}).join('')}</div>
  <p class="text-xs text-mute mt-3">يمكن حذف الخدمة فقط إذا كانت بدون مخدومين.</p>`;
 return `<div class="space-y-3">
  ${accCard()}${moreMenu()}
  <button data-sub="plan" class="w-full bg-card border border-acc/40 rounded-2xl p-4 flex items-center gap-3 text-start"><div class="w-11 h-11 rounded-xl bg-warn/15 text-warn grid place-items-center text-xl">🗺</div><div class="flex-1"><div class="font-bold">خطة البرنامج</div><div class="text-xs text-mute">ما تم وما سيُستكمل لاحقًا</div></div><span class="text-mute rotate-180">${ic('back','w-5 h-5')}</span></button>
  <button data-sub="services" class="w-full bg-card border border-line rounded-2xl p-4 flex items-center gap-3 text-start"><div class="w-11 h-11 rounded-xl bg-acc/15 text-acc grid place-items-center">${ic('mem','w-6 h-6')}</div><div class="flex-1"><div class="font-bold">الخدمات والفصول</div><div class="text-xs text-mute">${S.services.length} خدمات · ${S.members.length} مخدوم</div></div><span class="text-mute rotate-180">${ic('back','w-5 h-5')}</span></button>
  </div>`}

/* ========== PART 2: الحضور + الافتقاد + التقارير ========== */
let TODAY=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);const REAL=TODAY;
S.sess=S.sess||{};S.notes=S.notes||{};S.reports=S.reports||[];
S.members.forEach((m,i)=>{if(m.bd===undefined){const d=new Date();d.setDate(d.getDate()+[1,0,4,60,6,120,200,300,45,90][i%10]);m.bd=d.toISOString().slice(5,10)}});
const ST={p:['حاضر','bg-ok border-ok text-white'],l:['متأخر','bg-warn border-warn text-bg'],a:['غايب','bg-bad border-bad text-white'],e:['معتذر','bg-sky-500 border-sky-500 text-white']};
const day=()=>S.sess[TODAY]||(S.sess[TODAY]={}),closedToday=()=>S.reports.find(r=>r.date===TODAY),lastR=()=>S.reports.find(r=>r.date===RD)||closedToday()||S.reports[S.reports.length-1];
const arDate=(d=new Date())=>d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
const dtb=md=>{const t=new Date();t.setHours(0,0,0,0);const d=new Date(t.getFullYear(),+md.slice(0,2)-1,+md.slice(3));if(d<t)d.setFullYear(d.getFullYear()+1);return Math.round((d-t)/864e5)};
const streak=m=>{let c=0;for(let i=m.att.length-1;i>=0&&!m.att[i];i--)c++;return c};   // غياب متتالي
const counts=()=>{const d=day(),c={p:0,l:0,a:0,e:0};S.members.forEach(m=>{if(d[m.id])c[d[m.id]]++});return c};
const bdText=n=>n===0?'اليوم 🎂':n===1?'بكرة':'بعد '+n+' أيام';
const stat=(n,l,c)=>`<div class="bg-card border border-line rounded-2xl p-3 text-center"><div class="text-2xl font-extrabold ${c}">${n}</div><div class="text-[11px] text-mute">${l}</div></div>`;
const bdWa=m=>wa(m.phone)+'?text='+encodeURIComponent(`كل سنة وإنت طيب يا ${m.name.split(' ')[0]} 🎂 ربنا يبارك في عمرك ✝️`);
const alerts=()=>{const o=[];S.members.forEach(m=>{const k=m.stat==='مسافر'?0:streak(m),n=m.bd?dtb(m.bd):99;if(k>=2&&pf().fu)o.push({m,t:'abs',k});if(n<=1&&pf().bd)o.push({m,t:'bd',n})});return o};
const card='bg-card border border-line rounded-2xl p-4 mt-3';

/* --- حضور اليوم --- */
function vAtt(){
 const d=day(),c=counts(),cl=closedToday(),f=ui.f,l=S.members.filter(m=>f==='all'||m.sid===f);
 return `<div class="flex items-center justify-between"><div><label class="font-extrabold cursor-pointer relative">${arDate(new Date(TODAY+'T12:00'))} ▾<input type="date" id="adt" max="${REAL}" value="${TODAY}" aria-label="تاريخ الجلسة" class="absolute inset-0 opacity-0 w-full"></label><div class="text-xs ${cl?'text-ok':'text-mute'}">${cl?'الجلسة مغلقة ✓':'جلسة مفتوحة'}</div></div>${cl?'':'<div class="flex gap-2"><button data-ba="open" class="text-xs text-acc border border-acc/40 rounded-lg px-3 py-1.5">☑ تسجيل جماعي</button><button data-a="allp" class="text-xs text-ok border border-ok/40 rounded-lg px-3 py-1.5">الكل حاضر</button></div>'}</div>
 <div class="grid grid-cols-4 gap-2 mt-3">${stat(S.members.length,'الإجمالي','text-slate-100')}${stat(c.p+c.l,'حاضر','text-ok')}${stat(c.a,'غايب','text-bad')}${stat(c.e,'معتذر','text-sky-400')}</div>
 ${c.l?`<p class="text-xs text-warn mt-1.5">منهم ${c.l} متأخر</p>`:''}
 <div class="flex gap-2 overflow-x-auto py-3 -mx-4 px-4">${[['all','الكل',S.members.length],...S.services.map(s=>[s.id,s.name,countOf(s.id)])].map(([id,n,k])=>`<button data-f="${id}" class="shrink-0 px-4 py-1.5 rounded-full text-sm border ${f===id?'bg-acc border-acc text-white font-bold':'border-line text-mute bg-card'}">${esc(n)} · ${k}</button>`).join('')}</div>
 <div class="space-y-3">${l.map(m=>{const s=d[m.id],p=pct(m),[t]=tone(p),k=streak(m);return `<div class="bg-card border border-line rounded-2xl p-3">
  <div data-m="${m.id}" class="flex items-center gap-3 cursor-pointer">${avatar(m)}<div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(m.name)}${(S.notes[m.id]||[]).length?' 📝':''}</div><div class="text-xs text-mute"><span class="${t} font-bold">${p===null?'—':p+'%'}</span>${k>=2?` · <span class="text-bad">غاب ${k} متتالي</span>`:''}${m.bd&&dtb(m.bd)<=1?' · 🎂':''}</div></div><span class="text-xs text-acc">افتقاد ›</span></div>

/* ---------- تقويم الكنيسة ---------- */
const CMN=['توت','بابه','هاتور','كيهك','طوبه','أمشير','برمهات','برمودة','بشنس','بؤونة','أبيب','مسرى','النسيء'];
function copOf(dt){const N=Math.floor(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/864e5)+2440588-1825030,st=y=>365*(y-1)+Math.floor(y/4);
 let y=Math.floor(N/365.25)+1;while(st(y+1)<=N)y++;while(st(y)>N)y--;const r=N-st(y);return{y,m:Math.floor(r/30)+1,d:r%30+1}}
function easterOf(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),dd=(d+e+114)%31+1;return new Date(y,m-1,dd+13,12)}
const FEASTS=[[1,1,'🌿 النيروز — رأس السنة القبطية'],[1,17,'✝️ عيد الصليب'],[4,29,'⭐ عيد الميلاد المجيد'],[5,6,'عيد ختان السيد المسيح'],[5,11,'💧 عيد الغطاس'],[6,8,'عيد دخول السيد المسيح الهيكل'],[7,29,'🕊️ عيد البشارة'],[9,24,'عيد دخول السيد المسيح أرض مصر'],[11,5,'عيد الرسل'],[12,13,'⛰️ عيد التجلي'],[12,16,'👑 عيد صعود جسد السيدة العذراء']];
const FASTS=[[3,16,4,28,'🥣 صوم الميلاد'],[12,1,12,15,'🥣 صوم السيدة العذراء']];
function calEvents(from,to){const ev=[],cs=[],ext=new Date(to);ext.setDate(ext.getDate()+60);
 for(let t=new Date(from);t<=ext;t.setDate(t.getDate()+1)){const c=new Date(t);c.setHours(12,0,0,0);cs.push([c,copOf(c)])}
 const find=(m,d,after)=>cs.find(([dt,c])=>c.m===m&&c.d===d&&dt>after);

const PAPMAX=10;let PAPC={},PURLS=[],PCL={},PCLD={};
function papDB(){return new Promise((res,rej)=>{const r=indexedDB.open('kenisty_papers',1);r.onupgradeneeded=()=>{const s=r.result.createObjectStore('p',{keyPath:'id'});s.createIndex('lid','lid')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function papAll(lid){const d=await papDB();return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').index('lid').getAll(lid);q.onsuccess=()=>res((q.result||[]).sort((a,b)=>a.t-b.t));q.onerror=()=>rej(q.error)})}
async function papGet(id){const d=await papDB();return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function papPut(o){const d=await papDB();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function papDel(id){const d=await papDB();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function papCounts(){const d=await papDB();return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').getAll();q.onsuccess=()=>{const c={};(q.result||[]).forEach(p=>c[p.lid]=(c[p.lid]||0)+1);res(c)};q.onerror=()=>rej(q.error)})}
function papShrink(file,max=1280,q=.72){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q)};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
function dataToBlob(u){const p=u.split(','),m=(p[0].match(/:(.*?);/)||[])[1]||'image/jpeg',s=atob(p[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m})}

function loadLib(url,g){return new Promise((res,rej)=>{if(window[g])return res();const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=()=>rej(new Error('lib'));document.head.appendChild(s)})}
const AD=t=>String(t==null?'':t).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const nName=t=>AD(t).replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();
function nPhone(t){let p=AD(t).replace(/[^\d+]/g,'');if(p.startsWith('+20'))p='0'+p.slice(3);else if(p.startsWith('0020'))p='0'+p.slice(4);else if(/^20\d{10}$/.test(p))p='0'+p.slice(2);else if(/^1\d{9}$/.test(p))p='0'+p;return p.replace(/\D/g,'')}
function bdOk(mo,d){mo=+mo;d=+d;return mo>=1&&mo<=12&&d>=1&&d<=31?String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'):''}
function nBd(t){const s=AD(t).trim();let m;
 if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return bdOk(m[2],m[3]);
 if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))return bdOk(m[2],m[1]);
 if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})$/))return bdOk(m[2],m[1]);return ''}
function csvSplit(l,d){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===d&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())}
function impRows(txt){const L=txt.split(/\r?\n/).filter(x=>x.trim());if(!L.length)return[];const f=L[0],d=f.includes('\t')?'\t':(f.split(';').length>f.split(',').length?';':(f.includes('،')&&!f.includes(',')?'،':','));return L.map(l=>csvSplit(l,d))}
const NAMEH=/^(الاسم|اسم|الاسم الكامل|اسم المخدوم|name|full name)$/,PHONEH=/^(التليفون|تليفون|الموبايل|موبايل|رقم التليفون|رقم الموبايل|رقم الهاتف|الهاتف|تليفون ولي الامر|phone|mobile|tel)$/,BDH=/^(تاريخ الميلاد|الميلاد|عيد الميلاد|birthday|birth date|dob)$/;
function impRecords(rows){if(!rows.length)return[];const hd=rows[0].map(x=>nName(x)),fi=re=>hd.findIndex(h=>re.test(h));
 let ni=fi(NAMEH),pi=fi(PHONEH),bi=fi(BDH),body=rows;
 if(ni>=0||pi>=0||bi>=0){body=rows.slice(1);if(ni<0)ni=0}else{ni=0;pi=rows[0].length>1?1:-1;bi=rows[0].length>2?2:-1}
 return body.map(r=>({name:String(r[ni]||'').replace(/\s+/g,' ').trim(),phone:pi>=0?nPhone(r[pi]):'',bd:bi>=0?nBd(r[bi]):''})).filter(x=>x.name.length>=2&&!/^[\d\s+]+$/.test(x.name))}
function impSet(rec){const ph=new Set(impBase().map(m=>nPhone(m.phone)).filter(Boolean)),nm=new Set(impBase().map(m=>nName(m.name))),sp=new Set(),sn=new Set();
 ui.imp={rows:rec.map(r=>{let dup='';const n=nName(r.name);
  if((r.phone&&ph.has(r.phone))||nm.has(n))dup='موجود';else if((r.phone&&sp.has(r.phone))||sn.has(n))dup='مكرر في الملف';
  if(r.phone)sp.add(r.phone);sn.add(n);return{...r,dup,on:!dup}})};render()}
async function impFile(f){const nm=f.name.toLowerCase();let rows;
 try{if(/\.xlsx?$/.test(nm)){await loadLib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','XLSX');
   const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true,dateNF:'yyyy-mm-dd'}),ws=wb.Sheets[wb.SheetNames[0]];
   rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''}).map(r=>r.map(x=>String(x)))}
  else{let t=await f.text();if(t.includes('\uFFFD'))t=new TextDecoder('windows-1256').decode(await f.arrayBuffer());rows=impRows(t)}}
 catch(_){return toast('تعذّر قراءة الملف — جرّب CSV أو الصق القائمة')}
 const rec=impRecords(rows);if(!rec.length)return toast('ما لقيتش أسماء في الملف');impSet(rec)}

function saDB(){return new Promise((res,rej)=>{const r=indexedDB.open('kenisty_sermon_audio',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('a',{keyPath:'id'});d.createObjectStore('t',{keyPath:'k'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function saTx(st,mode,fn){return saDB().then(d=>new Promise((res,rej)=>{const t=d.transaction(st,mode);let out;const rq=fn(t.objectStore(st));if(rq)rq.onsuccess=()=>{out=rq.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}))}
async function saScan(){try{const d=await saDB();await new Promise((res,rej)=>{const m={},rq=d.transaction('a','readonly').objectStore('a').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){const v=c.value;m[v.id]={dur:v.dur||0,size:v.size||(v.blob&&v.blob.size)||0,mime:v.mime||''};c.continue()}else{SAUD=m;res()}};rq.onerror=()=>rej(rq.error)})}catch(_){}}

function ctOK(){try{return 'contacts' in navigator&&'ContactsManager' in window&&!localStorage.getItem('kenisty_ctfail')}catch(_){return false}}
function ctFailed(){try{localStorage.setItem('kenisty_ctfail','1')}catch(_){}toast('اختيار الجهات مباشرة مش شغال في التطبيق ده — استخدم زرار «ملف vcf»');render()}
function qpDec(s){try{return decodeURIComponent(String(s).replace(/=([0-9A-Fa-f]{2})/g,'%$1'))}catch(_){return String(s)}}
function vcfParse(txt){const out=[];
 String(txt||'').replace(/\r/g,'').split(/BEGIN:VCARD/i).slice(1).forEach(card=>{
  const body=card.split(/END:VCARD/i)[0].replace(/\n[ \t]/g,'').replace(/=\n/g,'');
  const val=l=>{const i=l.indexOf(':'),h=l.slice(0,i).toUpperCase(),v=l.slice(i+1);return /QUOTED-PRINTABLE/.test(h)?qpDec(v):v.replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\n/gi,' ')};
  const lines=body.split('\n').filter(Boolean);let fn='',n='';const tels=[];
  lines.forEach(l=>{if(/^FN[;:]/i.test(l))fn=val(l);else if(/^N[;:]/i.test(l))n=val(l);else if(/^(ITEM\d+\.)?TEL[;:]/i.test(l)){const p=nPh(val(l));if(p)tels.push(p)}});
  let name=fn;if(!name&&n){const a=n.split(';');name=((a[1]||'')+' '+(a[0]||'')).trim()}
  name=String(name).replace(/\s+/g,' ').trim();if(name||tels.length)out.push({name,phone:tels[0]||'',phones:tels})});
 return out}

function wbDay(off){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(off||0));return d}
const wbIdx=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
let WBF={};
function wbFeast(d){const k=d.toDateString();if(k in WBF)return WBF[k];let f=null;
 try{if(typeof calEvents==='function'){const same=x=>x.dt&&x.dt.toDateString()===k;calEvents(d,d).filter(same).forEach(e=>{const m=WB_FEAST.find(x=>String(e.n).includes(x[0]));if(m&&!f)f=m})}}catch(_){}
 return WBF[k]=f}
function wbWords(t){try{return((typeof S!=='undefined'&&S.words)||[]).filter(x=>x.t===t&&x.text)}catch(_){return[]}}
function wbPick(off){const d=wbDay(off),i=wbIdx(d),f=wbFeast(d),
 V=WB_V.map(x=>({text:x[0],ref:x[1]})).concat(wbWords('v').map(x=>({text:x.text,ref:x.ref||''}))),
 R=WB_R.map(x=>({text:x})).concat(wbWords('r').map(x=>({text:x.text}))),
 Sy=WB_S.map(x=>({text:x[0],by:x[1]})).concat(wbWords('s').map(x=>({text:x.text,by:x.ref||''})));
 const v=f?{text:f[1],ref:f[2]}:V[i%V.length];

function monthData(ym){const rs=S.reports.filter(r=>r.date.startsWith(ym)),ds=rs.map(r=>r.date);

const rowM=x=>`<div data-m="${x.m.id}" class="flex items-center gap-3 py-2 cursor-pointer">${avatar(x.m)}<div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(x.m.name)}</div><div class="text-xs text-mute">حاضر ${x.p+x.l} · غايب ${x.a}</div></div><span class="font-bold ${tone(x.rate)[0]}">${x.rate}%</span></div>`;

 ${L.length?'<button data-sv="bdshare" class="w-full mt-3 bg-ok text-white font-bold rounded-xl py-3">مشاركة القائمة على واتساب</button>':''}`}

const stLabel={p:['حاضر','text-ok'],l:['متأخر','text-warn'],a:['غايب','text-bad'],e:['معتذر','text-sky-400']};
const histRows=(map,id)=>Object.keys(map).filter(d=>map[d][id]).sort().reverse().map(d=>[d,map[d][id]]);
function histBlock(map,id){const r=histRows(map,id),n={p:0,l:0,a:0,e:0};r.forEach(([,v])=>n[v]++);const den=n.p+n.l+n.a,pc=den?Math.round((n.p+n.l)/den*100):null;
 return `<div class="${card}"><h2 class="font-bold mb-1">سجل الحضور</h2>${r.length?`<div class="grid grid-cols-4 gap-2 mt-2 text-center text-xs">${[['حاضر',n.p,'text-ok'],['متأخر',n.l,'text-warn'],['غايب',n.a,'text-bad'],['معتذر',n.e,'text-sky-400']].map(([l,v,c])=>`<div class="bg-bg rounded-xl py-2"><b class="text-base ${c}">${v}</b><br>${l}</div>`).join('')}</div><div class="text-xs text-mute mt-2">نسبة الحضور ${pc===null?'—':pc+'%'}</div><div class="mt-2 max-h-56 overflow-y-auto">${r.map(([d,v])=>`<div class="flex justify-between py-1.5 border-b border-line last:border-0 text-sm"><span>${arDate(new Date(d+'T12:00'))}</span><span class="font-bold ${stLabel[v][1]}">${stLabel[v][0]}</span></div>`).join('')}</div>`:'<p class="text-sm text-mute">لا يوجد حضور مسجّل بعد</p>'}</div>`}
function svHist(id){const x=svFind(id);if(!x)return;
 $('#sb').innerHTML=`<div class="max-h-[84vh] overflow-y-auto"><div class="flex items-center gap-3">${avatar(x)}<div><div class="font-extrabold">${esc(x.name)}</div><div class="text-xs text-mute">${roleTag(x)}</div></div></div>${histBlock(S.vsess,id)}</div>`;$('#sheet').classList.remove('hidden')}

/* --- تقرير الافتقاد: اتصالات وزيارات الشهر + مين محتاج افتقاد --- */
const FUT=['اتصال','زيارة','واتساب','مقابلة','ملاحظة'];
function fuData(ym){const tot={},per={};FUT.forEach(t=>tot[t]=0);
 S.members.forEach(m=>(S.notes[m.id]||[]).forEach(n=>{const d=new Date(n.ts);if(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')!==ym)return;
  tot[n.type]=(tot[n.type]||0)+1;const r=per[m.id]=per[m.id]||{m,c:0,last:0};r.c++;r.last=Math.max(r.last,n.ts)}));
 return{tot,rows:Object.values(per).sort((a,b)=>b.c-a.c)}}
const needFu=()=>S.members.filter(m=>streak(m)>=2).map(m=>{const ns=S.notes[m.id]||[];return{m,k:streak(m),last:ns.length?Math.max(...ns.map(n=>n.ts)):0}}).sort((a,b)=>b.k-a.k||a.last-b.last);
function vFu(){const ym=ui.fm||REAL.slice(0,7),{tot,rows}=fuData(ym),all=FUT.reduce((a,t)=>a+tot[t],0),need=needFu();
 return `<input type="month" id="fmo" value="${ym}" max="${REAL.slice(0,7)}" aria-label="الشهر" class="${inp}">
 <div class="grid grid-cols-4 gap-2 mt-3">${['اتصال','زيارة','واتساب','مقابلة'].map(t=>stat(tot[t],t,'text-acc')).join('')}</div>
 <p class="text-xs text-mute mt-2">إجمالي الافتقاد في ${ymName(ym)}: <b>${all}</b>${tot['ملاحظة']?' (منها '+tot['ملاحظة']+' ملاحظة)':''}</p>
 <div class="${card}"><h2 class="font-bold mb-1">محتاجين افتقاد (غابوا جلستين أو أكتر)</h2>${need.map(({m,k,last})=>`<div data-m="${m.id}" class="flex items-center gap-3 py-2 border-b border-line last:border-0 cursor-pointer">${avatar(m)}<div class="min-w-0 flex-1"><div class="font-bold truncate">${esc(m.name)}</div><div class="text-xs text-mute">${last?'آخر افتقاد: '+dm(new Date(last)):'لم يُفتقد بعد'}</div></div><span class="text-xs px-2 py-0.5 rounded-full ${k>=3?'bg-bad/15 text-bad':'bg-warn/15 text-warn'}">غاب ${k}</span></div>`).join('')||'<p class="text-sm text-mute py-3">لا يوجد غياب متتالي حاليًا 🎉</p>'}</div>
 <div class="${card}"><h2 class="font-bold mb-1">اللي اتفتقدوا في ${ymName(ym)}</h2>${rows.map(r=>`<div data-m="${r.m.id}" class="flex items-center gap-3 py-2 border-b border-line last:border-0 cursor-pointer">${avatar(r.m)}<div class="flex-1 font-bold truncate">${esc(r.m.name)}</div><span class="text-sm"><b>${r.c}</b> مرة</span></div>`).join('')||'<p class="text-sm text-mute py-3">لا يوجد افتقاد مسجّل في هذا الشهر. سجّله من ملف المخدوم.</p>'}</div>
 <button data-sv="fushare" class="w-full mt-3 bg-ok text-white font-bold rounded-xl py-3">مشاركة التقرير على واتساب</button>`}
function fuText(){const ym=ui.fm||REAL.slice(0,7),{tot}=fuData(ym),need=needFu();
 return '🤝 تقرير الافتقاد — '+ymName(ym)+'\nاتصال: '+tot['اتصال']+' · زيارة: '+tot['زيارة']+' · واتساب: '+tot['واتساب']+' · مقابلة: '+tot['مقابلة']+'\n'+(need.length?'\nمحتاجين افتقاد:\n'+need.map(q=>'• '+q.m.name+' (غاب '+q.k+')').join('\n')+'\n':'')+'\nكنيستي القبطية 3'}

/* --- دليل الاستخدام --- */
function vHelp(){const ho=ui.hopen;ui.hopen=null;const q=(t,a,k)=>`<details class="${card}" ${k&&ho===k?'open':''}><summary class="font-bold cursor-pointer">${t}</summary><div class="text-sm text-mute mt-2 leading-7">${a}</div></details>`;
 return `<p class="text-sm text-mute">اضغط على أي سؤال علشان يفتح الشرح.</p>`+
 q('البداية السريعة','١) من <b>المخدومين</b> اضغط + إضافة (أو الصق قايمة أسماء).<br>٢) من <b>الحضور</b> سجّل حاضر / متأخر / غايب / معتذر.<br>٣) اضغط <b>إغلاق الجلسة</b> علشان يتحدّث الحضور ويتعمل التقرير.')+

 q('الافتقاد والملاحظات','اضغط على اسم أي مخدوم: هتلاقي ملفه، وسجل حضوره، وقوالب واتساب، وخانة لتسجيل اتصال أو زيارة. وتقرير الافتقاد في «المزيد» بيوريك مين محتاج افتقاد.')+
 q('الخدام ونقاط الحضور','كارت «الخدام وحضورهم» في شاشة اليوم: أضف الخدام واختار الخدمة المسؤولين عنها وسجّل حضورهم. «نقاط الحضور»: ترتيب شهري (حاضر ٥ نقاط / متأخر ٣، وتتغيّر من الإعدادات).')+
 q('أعياد الميلاد','سجّل تاريخ الميلاد في ملف المخدوم (✎ تعديل ← بيانات إضافية). «أعياد الميلاد» بيعرض أسبوع أو شهر أو شهرين أو فترة تختارها، مع تهنئة واتساب.')+
 q('الشغل بدون إنترنت','كل حاجة بتتحفظ على موبايلك فورًا، وبتتزامن مع السيرفر لما النت يرجع. المؤشر فوق بيوضح الحالة.')+
 q('الأكواد وطلبات الانضمام (للمالك)','«👑 لوحة المالك» في المزيد: أكواد السنة، وقبول أو رفض طلبات الخدام الجداد. الرقم السري بتختاره أول مرة.')+
 q('👥 فريق الخدمة: خدام يشوفوا مخدوميهم','<b>الفكرة:</b> بتضيف خادم معاك، فيشوف مخدومين خدماته بس ويتصل بيهم، من غير ما يقدر يعدّل أو يمسح حاجة.<br><br><b>الخادم يعمل إيه؟</b><br>١) يعمل حساب ويدخل بكود الدعوة.<br>٢) يفتح «المزيد ← فريق الخدمة».<br>٣) يضغط «نسخ الكود» ويبعته لأمين الخدمة على واتساب.<br><br><b>أمين الخدمة يعمل إيه؟</b><br>١) يفتح «المزيد ← فريق الخدمة» ويضغط «+ إضافة خادم».<br>٢) يلصق الكود ويكتب اسم الخادم.<br>٣) يختار الصلاحية (عرض فقط، أو عرض + تسجيل حضور) والخدمات اللي الخادم يشوفها (لو ما اختارش يشوف الكل) ويضغط حفظ.<br>٤) الخادم يقفل التطبيق ويفتحه تاني، فيظهر له شريط أزرق مكتوب فيه «وضع العرض فقط».<br><br><b>الخادم بيقدر:</b> يشوف مخدومين خدماته، ويتصل أو يبعت واتساب، ويشوف أعياد الميلاد والمحاضرات.<br><b>الخادم مش بيقدر:</b> يعدّل أو يمسح أو يقفل الجلسة. لو اخترت له «عرض + تسجيل حضور» بيسجّل حضور مخدوميه بنفسه، وبيوصلك تلقائيًا (وبيتسجل في سجل التعديلات).<br><br><b>لإزالة خادم:</b> من نفس الشاشة اضغط «إزالة» جنب اسمه.<br><br><b>مرة واحدة بس (لصاحب التطبيق):</b> لو ظهرت رسالة «فعّل القواعد»، لازم تتضاف إعدادات في Firebase من ملف القواعد اللي اتسلّم معاك.','team')+
 q('🎓 المحاضرات','١) افتح «المزيد ← المحاضرات» واضغط «+ إضافة محاضرة» (الاسم واليوم والميعاد).<br>٢) اضغط «👥 الحضور» واختار الخدام والمخدومين اللي بيحضروها.<br>٣) تبويب «حسب الشخص» بيوريك كل واحد بيحضر أنهي أيام.<br>٤) لو كتبت ميعاد، بيجيلك تنبيه قبلها بساعة. وزرار «مشاركة» بيبعت القايمة على واتساب.','lect')+
 q('📷 كروت الحضور QR','١) افتح «المزيد ← كروت الحضور QR» واختار الخدمة واضغط «طباعة كروت» (محتاج نت مرة واحدة).<br>٢) كل مخدوم ياخد كارته.<br>٣) وقت الحضور اضغط «مسح للتحضير» ووجّه الكاميرا على الكارت، فيتسجل حاضر في جلسة النهارده.<br>بيشتغل في كروم على أندرويد، ولو الكاميرا مش شغالة اكتب الكود يدويًا.','qr')+
 q('🔔 الإشعارات والتذكيرات','<b>🔔 صندوق الإشعارات:</b> في تبويب «التنبيهات» فيه تبويبين: «التنبيهات» (اللي محتاج تعمله دلوقتي)، و«🔔 الإشعارات» (سجل بكل إشعار وصلك: ملخص اليوم، قرب الاجتماع والمحاضرات، الزيارات، الإنذار المبكر، وحضور الخدام). النقطة الزرقاء = جديد، والرقم الأحمر على أيقونة التنبيهات = غير المقروء. بيشتغل حتى لو إشعارات الجهاز مقفولة، ومحفوظ على جهازك بس (آخر ١٠٠).<br><b>إشعارات الجهاز:</b> «المزيد ← إعدادات التنبيهات ← تفعيل إشعارات الجهاز»، وجرّب زرار «جرّب إشعار الآن». بتظهر لما تفتح التطبيق وأثناء فتحه.<br><b>تذكير والتطبيق مقفول:</b> من نفس الصفحة اختار التذكيرات ونزّل الملف وافتحه في تقويم الموبايل، والتقويم هو اللي بينبّهك في وقتها.','notif')+
 q('🗓️ خطة الافتقاد الأسبوعية','بتوزع المخدومين الغايبين على الخدام تلقائيًا: على الخادم المكتوب في ملف المخدوم، وإلا خادم نفس الخدمة، بالتساوي. كل مخدوم عليه زرار اتصال وواتساب، وتقدر تبعت لكل خادم قايمته على واتساب. ومن شاشة اليوم زرار «📨 رسالة افتقدناك» بيبعت لكل الغايبين رسالة جاهزة بالاسم.','fplan')+
 q('📆 التقرير السنوي','السنة الخدمية من سبتمبر لأغسطس. بيعرض متوسط الحضور وكل شهر وكل خدمة والأكثر مواظبة والأكثر غيابًا. تشاركه على واتساب أو تطبعه PDF. بيعتمد على الجلسات اللي اتقفلت.','year')+
 q('🖨️ ورقة الحضور المطبوعة','اختار الخدمة وعدد الأسابيع (٤ أو ٦ أو ٨) والتواريخ بتتكتب لوحدها، وممكن تضيف صور المخدومين. بعدها «طباعة / حفظ PDF». لو الطباعة مش شغالة داخل الـ APK افتح البرنامج من كروم.','print')+
 q('💾 النسخة الاحتياطية','«المزيد ← نسخة احتياطية»: نزّل ملف فيه كل بياناتك واحتفظ بيه (واتساب أو درايف). للاستعادة اختار الملف. نزّل نسخة كل أسبوعين على الأقل، وقبل أي مسح أو تسجيل خروج.','bak')+
 q('✝️ تقويم الكنيسة','بيعرض التاريخ القبطي والأعياد والأصوام الجاية (الثابتة والمتغيرة زي القيامة والصوم الكبير)، وتقدر تضيف مناسبات خدمتك. راجع التواريخ مع روزنامة كنيستك.','cal')+
 q('🏅 الشارات ورسم الحضور','في ملف المخدوم: 🔥 مواظب (٤ جلسات حضور متتالية)، 🌟 حضور كامل، 🎖️ ١٠ جلسات، 🏆 ٢٥ جلسة. وفيه رسم بياني بنسبة حضوره شهريًا. وفي ملفه كمان زرار 🎤 للإملاء الصوتي بدل الكتابة، وقايمة لنقله لخدمة تانية.','badges')+
 q('☀️ الوضع الفاتح','«المزيد ← الإعدادات ← لون الخلفية ← فاتح». وتقدر ترجع لأي لون في أي وقت.','light')+
 q('📷 أوراق المحاضرات (تصوير ومشاركة)','<b>١)</b> «المزيد ← المحاضرات» واختار اليوم.<br><b>٢)</b> تحت المحاضرة اضغط «📷 الأوراق».<br><b>٣)</b> سيب علامة «☁️ شاركها مع أمين الخدمة والفريق» لو عايز الأمين والخدام يشوفوها، وشيلها لو الصورة ليك بس.<br><b>٤)</b> «📷 تصوير» يفتح الكاميرا، أو «🖼 من المعرض». الصورة بتتصغّر لوحدها.<br><b>٥)</b> اضغط الصورة تكبّرها. «مشاركة» تبعتها واتساب، و«حذف» تمسحها.<br><br>☁️ = صورة مشتركة بتظهر لكل الفريق. 📱 = صورة على جهازك بس.<br>أمين الخدمة يحذف أي صورة، والخادم يحذف صوره هو. الحد الأقصى ١٠ صور للمحاضرة.<br><br><b>مرة واحدة (لصاحب التطبيق):</b> عشان الصور المشتركة تشتغل لازم تحدّث قواعد Firebase من ملف القواعد الجديد. لحد ما تتحدّث، الصور بتتحفظ على الجهاز بس.<br>الصور اللي على الجهاز مش بتدخل في النسخة الاحتياطية، وبتضيع لو مسحت بيانات المتصفح.','papers')+
 q('📥 إضافة أشخاص بالجملة (جهات الاتصال)','<b>١)</b> «المزيد ← استيراد المخدومين».<br><b>٢)</b> اختار الخدمة اللي هيتضافوا ليها.<br><b>٣)</b> اختار الطريقة (وفوق اختار هتضيفهم كـ مخدومين أو خدام أو زوّار):<br>• <b>📇 جهات الاتصال:</b> اختيار الأسماء مباشرة من موبايلك (كروم على أندرويد).<br>• <b>ملف جهات اتصال .vcf:</b> بيشتغل في أي متصفح، حتى جوه الـ APK: من تطبيق جهات الاتصال حدّد الأسماء ← مشاركة ← احفظ كملف vcf، واختاره هنا.<br>• <b>ملف Excel أو CSV:</b> أول سطر عناوين (الاسم، التليفون، تاريخ الميلاد) أو من غير عناوين بنفس الترتيب. ممكن تنزّل «نموذج جاهز للتعبئة» من نفس الشاشة.<br>• <b>لصق قائمة:</b> سطر لكل مخدوم.<br><b>٤)</b> هتشوف معاينة بالأسماء. الأسماء الموجودة أو المكررة بتتشال علامتها تلقائيًا، وتقدر تعدّل اختيارك، وبعدين «استيراد المحدد».<br><br>ملف Excel محتاج نت أول مرة لقراءته.','imp')+
 q('🎓 ترقية السنة الخدمية','في بداية السنة الجديدة (سبتمبر) بدل ما تنقل كل مخدوم لوحده:<br><b>١)</b> «المزيد ← ترقية السنة الخدمية».<br><b>٢)</b> اضغط «ترتيب تلقائي» (كل فصل ينتقل للي بعده والأخير يتخرّج)، أو اختار لكل فصل بنفسك.<br><b>٣)</b> راجع «اللي هيحصل»، وممكن تختار «صفّر نسب الحضور».<br><b>٤)</b> «تنفيذ الترقية»: هتنزّل نسخة احتياطية تلقائيًا الأول.<br><br>الخريجين بيتشالوا من القوائم ويتحفظوا في قائمة «الخريجين». سجل الجلسات والتقرير السنوي بيفضلوا زي ما هما.<br>الخدام ما بيتأثروش. ما تنفذهاش مرتين في نفس السنة.','promo')+
 q('🗓️ الزيارات المجدولة','<b>١)</b> افتح ملف المخدوم واضغط «📅 جدولة زيارة»، واختار اليوم والميعاد والخادم وسبب الزيارة.<br><b>٢)</b> «المزيد ← الزيارات المجدولة» بيعرض القادمة والمتأخرة (بالأحمر).<br><b>٣)</b> بعد الزيارة اضغط «✓ تمت» واكتب النتيجة، وبتتسجل في ملاحظات المخدوم. «↻ تأجيل» يغيّر الميعاد.<br><br>زيارات النهارده بتظهر في شاشة اليوم وفي إشعار الصبح. ولو حابب تذكير والتطبيق مقفول، فعّل «الزيارات المجدولة» في ملف تذكيرات التقويم (إعدادات التنبيهات).','visits')+
 q('🎙️ الوعظات (سجل شخصي)','<b>١)</b> «المزيد ← الوعظات» ثم «+ وعظة جديدة».<br><b>٢)</b> اكتب <b>اسم الوعظة</b> واختار <b>التاريخ</b>، واليوم (الجمعة مثلًا) بيظهر لوحده جنب التاريخ. الواعظ والآية والملاحظات اختيارية.<br><b>٣)</b> الوعظات بتظهر مرتبة بالأحدث ومقسمة بالشهور. اضغط على أي وعظة تفتحها، وفيها «مشاركة» واتساب و«تعديل» و«حذف». وفيه بحث فوق القايمة.<br><br><b>📁 ملف صوت من برا البرنامج:</b> في أي وعظة اضغط «📁 إضافة ملف صوت» واختار الملف (تسجيل من تطبيق تاني، أو صوت جالك على واتساب بصيغة opus أو m4a أو mp3…). أو من «⬆️ استيراد (نصوص أو صوت)» اختار ملف صوت وهيتعمل منه وعظة جديدة بنفس اسم الملف وتاريخه، وتقدر تعدّلهم.<br><br><b>🎤 التسجيل الصوتي:</b> افتح الوعظة واضغط «🎤 تسجيل صوتي»، أو من شاشة وعظة جديدة اضغط «حفظ وابدأ التسجيل». هيظهر شريط أحمر فوق فيه «إيقاف مؤقت» و«إنهاء وحفظ». <b>ما تقفلش الشاشة ولا تطلع من البرنامج أثناء التسجيل</b> لأن الموبايل ممكن يوقفه. التسجيل بياخد حوالي ١٤ ميجا للساعة. لو البرنامج اتقفل فجأة هتلاقي «استرجاع التسجيل» في شاشة الوعظات. التسجيل ليه «تشغيل» و«مشاركة» و«إعادة» و«حذف الصوت».<br><br><b>🔒 الخصوصية:</b> الوعظات محفوظة على جهازك أنت بس. مش بتتزامن مع Firebase، ومش بتظهر لأمين الخدمة ولا لأي خادم، وكل حساب على الجهاز له سجله.<br><b>النسخ الاحتياطي:</b> مش بتدخل في «النسخة الاحتياطية» العادية، وبتضيع لو مسحت بيانات المتصفح أو غيّرت الموبايل. استخدم «⬇️ تصدير» من نفس الشاشة، و«⬆️ استيراد» على الجهاز الجديد (التصدير للنصوص فقط، والتسجيلات الصوتية بتتشارك كملفات من زرار «مشاركة»).','sermon')+
 q('🧩 أنشطة الخدمة','من «المزيد ← أنشطة الخدمة»:<br>• <b>🎂 رسائل أعياد الميلاد:</b> تهنئة جاهزة بالاسم لأعياد الأسبوع، وزرار «إرسال للتالي».<br>• <b>⚠️ إنذار مبكر:</b> مخدومين كانوا بيحضروا كويس وآخر ٣ جلسات حضورهم قل، قبل ما يوصلوا للغياب المتتالي. بيظهر كمان كارت في شاشة اليوم.<br>• <b>🆕 الزوّار الجدد:</b> سجّل الزائر وتابع حالته (جديد، تحت المتابعة، انضم) وحوّله لمخدوم بضغطة.<br>• <b>🚌 الرحلات والمؤتمرات:</b> المشاركين والمدفوع والمتبقي لكل واحد، وتذكير واتساب لمن لم يدفع كامل.<br>• <b>🏆 المسابقات:</b> اكتب نقاط كل مخدوم، وبيظهر المتصدرين.<br>• <b>🧑‍🏫 اجتماع الخدام:</b> محضر وحضور الخدام ومهام ومين مسؤول.<br><br><b>ملف المخدوم:</b> ضفنا العنوان (مع زرار الخريطة) وحالة خاصة (مريض، مسافر، ظروف خاصة). المسافر ما بيظهرش في تنبيهات الغياب.<br><b>فلاتر المخدومين:</b> في تبويب «المخدومين» تحت البحث: غاب ٣+، أقل من ٥٠٪، حالات خاصة، بدون رقم، عيد ميلاد قريب.','svcx')+
 q('🏛️ أدوات الإدارة','من «المزيد ← أدوات الإدارة»:<br>• <b>📜 سجل التعديلات:</b> مين عمل إيه ومتى (إضافة وتعديل وحذف مخدومين، إغلاق الجلسات، الترقية، الاستيراد، وتسجيل حضور الخدام). آخر ٣٠٠ عملية.<br>• <b>🏷️ الشعار واسم الخدمة:</b> بيظهروا في أعلى الكشوف المطبوعة والتقارير.<br>• <b>📄 التقرير الشهري الرسمي:</b> اختار الشهر، وهتلاقي ملخص الحضور والجلسات والخدمات والغياب والزيارات، للطباعة PDF أو المشاركة، وفيه خانات توقيع.<br>وفيها اختصارات للتقرير السنوي والفريق والترقية والاستيراد والنسخة الاحتياطية.','admx')+
 q('🔐 تجديد الدخول كل شهرين','<b>الفكرة:</b> كل شهرين بيتغيّر كود الدخول، وكل خادم لازم يكتب الكود الجديد عشان يكمل يشوف بياناته. الكود بيوصله على واتساب رقمه، وده بيضمن إن اللي بيدخل لسه معروف لأمين الخدمة.<br><br><b>للمالك:</b><br>١) «👑 لوحة المالك ← الأكواد»، وفي كارت «🔐 التجديد الدوري» اختار مدة السماح (٧ أيام مثلًا) واضغط «تفعيل التجديد الدوري».<br>٢) اضغط «📨 إرسال الكود للخدام على واتساب»: هتلاقي قايمة الخدام اللي ليهم أرقام في «الخدام وحضورهم»، وكل ضغطة بتفتح واتساب برسالة جاهزة بالاسم والكود. «إرسال للتالي» بيكمل واحد ورا التاني.<br>٣) كل شهرين اضغط «فعّل الكود التالي»، وابعته للخدام بنفس الطريقة. مدة السماح بتبدأ من وقتها، وبعدها الكود القديم بيقفل لوحده.<br><br><b>للخادم:</b><br>١) بيظهر كارت «🔐 جدّد وصولك خلال X يوم» في شاشة اليوم، وبند «🔐 تجديد الوصول» في «المزيد».<br>٢) افتحه واكتب الكود اللي وصلك على واتساب واضغط «تجديد».<br>٣) لو عدّت مدة السماح من غير تجديد، هتظهر شاشة «تجديد الوصول» أول ما تفتح البرنامج. اكتب الكود وكمّل. <b>بياناتك ما بتضيعش</b>، بس مش بتظهر لك لحد ما تجدّد.<br><br><b>ملاحظات:</b><br>• المالك مش محتاج تجديد.<br>• الخادم اللي اتضاف من الطلبات بيحتاج التجديد كمان.<br>• ممكن توقف التجديد في أي وقت من نفس الكارت.<br>• لازم تحدّث قواعد Firebase بالملف الجديد (firestore-rules-v4) قبل ما تفعّل التجديد.','renew')+
 q('📣 الواتساب الجماعي (أي مناسبة)','<b>١)</b> «المزيد ← 📣 الواتساب الجماعي».<br><b>٢)</b> اختار <b>المناسبة</b> من القايمة: افتقاد، اطمئنان، عيد ميلاد، تذكير بالاجتماع، دعوة رحلة، تهنئة بعيد، تذكير محاضرة، شكر وتشجيع، ترحيب، إعلان عام، أو رسالة حرة.<br><b>٣)</b> عدّل النص زي ما تحب. استخدم أزرار {n} الاسم الأول و{g} ولي الأمر و{s} الخدمة و{d} تاريخ اليوم و{b} اسم الخدمة، وكل واحد بيستلم رسالة باسمه.<br><b>٤)</b> اختار <b>مين</b> هيستلم: الغايبين، أعياد الميلاد، الكل، غاب ٣+، إنذار مبكر، حالات خاصة، الخدام، الزوّار، أو خدمة معينة. وحدّد أكتر من شخص (تحديد الكل أو إلغاء الكل أو فرادى).<br><b>٥)</b> اضغط «▶ إرسال للتالي»: بيفتح واتساب للشخص الأول برسالته، ترجع وتضغط تاني للتالي، وهكذا. أو «إرسال» جنب أي اسم.<br><br><b>⭐ قوالبك أنت:</b> بعد ما تكتب رسالة اضغط «حفظ كقالب جديد» وسمّيها. تقدر تحدّثها أو تمسحها بعد كده.<br><b>ملاحظات:</b> أرقام الأخوات المكررة بتتشال علامتها تلقائيًا عشان ما توصلش نفس الرسالة مرتين. واتساب نفسه بيفتح محادثة واحدة في المرة، فمفيش إرسال تلقائي لكل الناس مرة واحدة. الرسايل بتتسجل في ملاحظات المخدوم.','gwa')+
 q('☑ تسجيل الحضور الجماعي','في تبويب «الحضور» اضغط «☑ تسجيل جماعي»:<br>١) اختار الحالة (حاضر، متأخر، غايب، معتذر).<br>٢) حدّد أكتر من مخدوم (تحديد الظاهر، أو فلتر بالخدمة، أو «غير المسجّلين»).<br>٣) «تطبيق على المحدد».<br><br>مفيد في آخر الجلسة: اختار «غير المسجّلين» ← «تحديد الظاهر» ← غايب ← تطبيق، فتسجّل كل اللي فاضلين غياب مرة واحدة.','batt')+
 q('✝️ الكلمة اليومية (آية وتأمل وكلمة منفعة)','فيه <b>شريط صغير</b> أعلى الشاشة بيتبدل كل ثواني بين: ✝️ آية اليوم، 🕊️ تأمل اليوم، 📜 كلمة منفعة من الآباء. بيتغير تلقائيًا كل يوم، وفي الأعياد (الميلاد والغطاس والقيامة والصليب والصوم الكبير وغيرها) بتظهر آية مناسبة للعيد.<br><br><b>اضغط على الشريط</b> تفتح الكلمة كاملة، وتقدر:<br>• تتصفح الأيام اللي فاتت والجاية.<br>• «مشاركة واتساب» أو «نسخ» لأي واحدة، أو «مشاركة الكلمة كاملة».<br>• <b>تخفي الشريط</b> (وترجعه) من علامة «إظهار الشريط».<br>• <b>تضيف كلماتك أنت</b> (آية أو تأمل أو كلمة منفعة) وتدخل في الدوران وتظهر للكل.<br><br>الآيات من ترجمة الفاندايك، وأقوال الآباء من أقوال آباء البرية والقديسين (بتصرف). تأكد من الاقتباس لو هتستخدمه في مطبوع رسمي. ومن «المزيد ← الكلمة اليومية» تقدر تفتحها في أي وقت.','word')+
 q('👤 الأدوار: مين بيدخل البرنامج وبيقدر يعمل إيه','<b>👑 المالك:</b> صاحب التطبيق (حسابه مسجّل كمالك في Firebase). معاه كل صلاحيات أمين الخدمة، وكمان «لوحة المالك» لأكواد الدعوة وقبول طلبات الانضمام.<br><br><b>⭐ أمين خدمة:</b> أي حساب دخل بكود الدعوة. بيدير بياناته وخدماته كلها (المخدومين والحضور والتقارير)، وبيضيف الخدام من «فريق الخدمة».<br><br><b>👁 خادم:</b> عضو في فريق أمين خدمة. بيشوف مخدومين خدماته بس ويتصل بيهم، من غير تعديل.<br><br><b>المخدومين:</b> دلوقتي هما أسماء مسجّلة جوه البرنامج ومش بيدخلوه بحساب.<br><br>الدور بيظهر فوق الشاشة دايمًا، وفي كارت «أنت داخل بصفة» أول «المزيد».<br><br><b>أنا المالك، لازم أضيف نفسي أمين خدمة؟</b> لأ، حسابك بالفعل أمين خدمة لبياناتك، ومعاه صلاحية المالك. تضيف الخدام من «المزيد ← فريق الخدمة».','roles')+
 q('📲 تثبيت البرنامج ومشاركته','<b>تثبيت على الموبايل:</b> افتح رابط البرنامج من كروم، اضغط ⋮ فوق، واختار «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية». هيبقى له أيقونة زي أي تطبيق، وبيتحدّث لوحده من غير ما تنزّل حاجة تاني.<br><br><b>لإضافة خادم جديد (لأمين الخدمة):</b> «👑 لوحة المالك ← الأكواد ← إرسال واتساب» بيبعت الرابط مع كود الدعوة. من غير الكود مفيش حد يقدر يدخل على بيانات الخدمة.','install')+
 q('نسيت الباسورد','من شاشة الدخول اكتب إيميلك واضغط «نسيت الباسورد؟». ولو بتدخل بـ Google اضغط زرار Google.')}

 else if(a==='hist')svHist(D.id)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='bdf'){ui.bdf=t.value;render()}else if(t.id==='bdt'){ui.bdt=t.value;render()}else if(t.id==='fmo'){ui.fm=t.value||REAL.slice(0,7);render()}});

let DIRTY=false;
new MutationObserver(()=>{DIRTY=false}).observe($('#sb'),{childList:true});
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{if(!e.target.closest||!e.target.closest('#sb')||!$('#dirty'))return;DIRTY=true;$('#dirty').classList.remove('hidden')}));
document.addEventListener('click',e=>{if(e.target.id==='sheet'&&DIRTY&&!confirm('في تغييرات غير محفوظة. تقفل من غير حفظ؟'))e.stopImmediatePropagation()},true);

/* ===== كود الدعوة: العضوية تُسجَّل مرة واحدة في members/{uid}، والقواعد تقارن الكود بـ config/invite ===== */

async function checkMember(u,code){
 if(localStorage.getItem(memKey(u.uid))==='1')return true;           // اتأكد قبل كده (يشتغل أوفلاين)
 const ref=doc(db,'members',u.uid);
 try{if((await getDoc(ref)).exists()){localStorage.setItem(memKey(u.uid),'1');return true}}
 catch(_){if(!navigator.onLine)return 'offline'}
 if(code){try{let ver=0;try{const st=await getDoc(doc(db,'status','renew'));ver=(st.exists()&&st.data().ver)||0}catch(_){}
  try{await setDoc(ref,{code,t:serverTimestamp(),ver})}catch(_){await setDoc(ref,{code,t:serverTimestamp()})}
  localStorage.setItem(memKey(u.uid),'1');return true}
  catch(_){return navigator.onLine?'bad':'offline'}}
 return 'need';
}

async function doUnlock(){const u=auth.currentUser,p=Q('#p1').value.trim(),tk=tryKey(u.uid);let t={n:0,until:0};

<script>
/* Service worker registration + offline helpers */
if ('serviceWorker' in navigator) {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { scope: './' });
      reg.addEventListener('updatefound', () => {                 // a new version was deployed
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'activated' && navigator.serviceWorker.controller) toast('تحديث جديد جاهز - أغلق التطبيق وافتحه');
        });
      });
      const ready = await navigator.serviceWorker.ready;           // cache what this first visit loaded
      ready.active && ready.active.postMessage({ type: 'CACHE_URLS', urls: performance.getEntriesByType('resource').map(r => r.name) });
    } catch (_) {}
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();   // ask the browser not to evict our data
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });   // retry sync when the app returns to front
  setInterval(() => { if (navigator.onLine) sync(); }, 60000);                                // and once a minute while open
}
</script>

 return `<div class="space-y-3"><div class="${card} !mt-0 text-center"><h2 class="font-bold">QR انضمام الخدام</h2><p class="text-sm text-mute mt-1">الخادم الجديد يمسح الكود بالكاميرا فيفتح البرنامج. كود الدعوة يتبعت له لوحده.</p><img id="jq" class="mx-auto mt-3 bg-white p-2 rounded-xl w-56 h-56" alt="QR"><div class="text-xs text-mute mt-2 break-all" dir="ltr">${esc(u)}</div></div><button data-v="jsh" class="${BT}">📤 مشاركة الرابط واتساب</button><button data-v="jpr" class="${BO}">🖨️ طباعة الكود</button></div>`};

/* 5) ملاحظة بعد الاتصال */
let pend=null,crSel='';
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="tel:"]');if(!a)return;const ph=a.getAttribute('href').slice(4).replace(/\D/g,'').slice(-9);
 const m=S.members.find(x=>x.phone&&String(x.phone).replace(/\D/g,'').slice(-9)===ph);if(m)pend={id:m.id,ts:Date.now()}},true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!pend)return;const p=pend;pend=null;const dt=Date.now()-p.ts;if(dt>36e5||dt<3000)return;callSheet(p.id)});
const callSheet=id=>{const m=findM(id);if(!m)return;crSel='';sheet(`<div class="max-h-[84vh] overflow-y-auto"><h2 class="font-extrabold">📞 مكالمة ${esc(m.name)}</h2><p class="text-xs text-mute">رد؟ فيه إيه؟</p><div class="grid grid-cols-2 gap-2 mt-3">${['رد وكله تمام','رد وعنده احتياج','مردّش','الرقم غلط'].map(x=>`<button data-v="cr" data-x="${x}" class="cr border border-line rounded-xl py-2.5 text-sm">${x}</button>`).join('')}</div><textarea id="crt" rows="3" class="${inp}" placeholder="ملاحظات (اختياري)"></textarea><button data-v="crs" data-id="${id}" class="${BT} mt-3">حفظ في ملاحظاته</button></div>`)};

/* 6) تقويم الشهر */
const C={feast:'#f59e0b',fast:'#a78bfa',mine:'#38bdf8',trip:'#38bdf8',lect:'#34d399',bd:'#f472b6'};
const vMgrid=()=>{const o=ui.mgo||0,b=now();b.setDate(1);b.setMonth(b.getMonth()+o);const y=b.getFullYear(),mo=b.getMonth(),first=new Date(y,mo,1,12),last=new Date(y,mo+1,0,12),ev={},today=ds(now());
 const add=(d,k,n)=>{const s=ds(d);(ev[s]=ev[s]||[]).push({k,n})};
 try{calEvents(first,last).forEach(e=>{if(e.k==='fast'){const end=e.end||e.dt;for(let t=new Date(e.dt);t<=end&&t<=last;t.setDate(t.getDate()+1))if(t>=first)add(t,'fast',e.n)}else if(e.dt>=first)add(e.dt,e.k,e.n)})}catch(_){}
 (S.trips||[]).forEach(t=>{if(t.date&&String(t.date).slice(0,7)===ds(first).slice(0,7))add(dd(String(t.date).slice(0,10)),'trip','🚌 '+t.name)});
 (S.lect||[]).forEach(l=>{for(let d=1;d<=last.getDate();d++){const t=new Date(y,mo,d,12);if(t.getDay()===l.day)add(t,'lect','🎤 '+(l.title||l.name||'محاضرة')+(l.time?' '+l.time:''))}});
 S.members.forEach(m=>{if(m.bd&&+m.bd.slice(0,2)===mo+1)add(new Date(y,mo,+m.bd.slice(3),12),'bd','🎂 '+m.name)});
 const sel=ui.mgd&&ui.mgd.slice(0,7)===ds(first).slice(0,7)?ui.mgd:(today.slice(0,7)===ds(first).slice(0,7)?today:ds(first));
 const cells=Array.from({length:first.getDay()},()=>'<div></div>').concat(Array.from({length:last.getDate()},(_,i)=>{const s=ds(new Date(y,mo,i+1,12)),ks=[...new Set((ev[s]||[]).map(x=>x.k))].slice(0,3);
  return `<button data-v="mday" data-d="${s}" class="aspect-square rounded-xl text-sm relative ${s===sel?'bg-acc text-white font-bold':'bg-card border border-line'} ${s===today?'ring-1 ring-warn':''}">${i+1}<span class="absolute bottom-1 inset-x-0 flex justify-center gap-0.5">${ks.map(k=>`<i style="width:5px;height:5px;border-radius:9px;background:${C[k]}"></i>`).join('')}</span></button>`}));
 const L=[...new Map((ev[sel]||[]).map(x=>[x.n,x])).values()];
 return `<div class="space-y-3"><div class="flex items-center justify-between"><button data-v="mg" data-n="-1" class="w-10 h-10 rounded-xl bg-card border border-line">›</button><b>${b.toLocaleDateString('ar-EG',{month:'long',year:'numeric'})}</b><button data-v="mg" data-n="1" class="w-10 h-10 rounded-xl bg-card border border-line">‹</button></div>
 <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-mute">${DAYS.map(n=>`<div>${n.slice(0,3)}</div>`).join('')}</div><div class="grid grid-cols-7 gap-1">${cells.join('')}</div>
 <div class="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-mute">${[['feast','أعياد'],['fast','أصوام'],['mine','مناسبات/رحلات'],['lect','محاضرات'],['bd','ميلاد']].map(([k,n])=>`<span><i style="display:inline-block;width:8px;height:8px;border-radius:9px;background:${C[k]}"></i> ${n}</span>`).join('')}</div>
 <div class="${card}"><h2 class="font-bold mb-1">${arDate(dd(sel))}</h2>${L.length?L.map(x=>`<div class="text-sm py-1" style="border-inline-start:3px solid ${C[x.k]};padding-inline-start:8px">${esc(x.n)}</div>`).join(''):'<p class="text-sm text-mute">مفيش حاجة في اليوم ده</p>'}</div></div>`};

/* 7) ملاحظة صوتية للمخدوم (على الجهاز) */
const vdb=()=>new Promise((res,rej)=>{const r=indexedDB.open('kenisty_voice',1);r.onupgradeneeded=()=>r.result.createObjectStore('a',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const vput=async rec=>{const d=await vdb();return new Promise((res,rej)=>{const t=d.transaction('a','readwrite');t.objectStore('a').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const vall=async()=>{const d=await vdb();return new Promise((res,rej)=>{const q=d.transaction('a').objectStore('a').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const vrm=async k=>{const d=await vdb();return new Promise(res=>{const t=d.transaction('a','readwrite');t.objectStore('a').delete(k);t.oncomplete=res})};
const vlist=async id=>{const el=$('#vl');if(!el)return;let l=[];try{l=(await vall()).filter(x=>x.mid===id).sort((a,b)=>b.ts-a.ts)}catch(_){}
 el.innerHTML=l.map(x=>`<div class="flex items-center gap-2"><audio controls preload="none" src="${URL.createObjectURL(x.blob)}" class="flex-1 h-9 min-w-0"></audio><span class="text-[10px] text-mute">${new Date(x.ts).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}</span><button data-v="vdel" data-k="${x.id}" data-mid="${id}" class="text-bad text-sm" aria-label="حذف">🗑</button></div>`).join('')||'<p class="text-xs text-mute">مفيش تسجيلات</p>'};
let REC=null;
async function vrec(id){if(REC){REC.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast('التسجيل مش مدعوم — افتح من كروم');
 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(_){return toast('اسمح بالميكروفون')}
 const ch=[],r=new MediaRecorder(st),t0=Date.now();
 const iv=setInterval(()=>{const s=Math.round((Date.now()-t0)/1e3),b=$('#vrb');if(b)b.textContent='⏹ '+s+'/30';if(s>=30)r.stop()},500);
 r.ondataavailable=e=>e.data.size&&ch.push(e.data);
 r.onstop=async()=>{clearInterval(iv);st.getTracks().forEach(x=>x.stop());REC=null;const blob=new Blob(ch,{type:r.mimeType||'audio/webm'}),dur=Math.round((Date.now()-t0)/1e3);
  try{await vput({id:'v'+Date.now(),mid:id,ts:Date.now(),dur,blob});(S.notes[id]=S.notes[id]||[]).push({ts:Date.now(),type:'صوت',text:'🎙️ ملاحظة صوتية '+dur+' ث'});save()}catch(_){toast('تعذّر الحفظ')}
  const b=$('#vrb');if(b)b.textContent='تسجيل ٣٠ ثانية';vlist(id)};
 REC=r;r.start()}
const _ns=noteSheet;noteSheet=function(id){_ns(id);const h=$('#sb>div');if(h&&!$('#vl')){h.insertAdjacentHTML('beforeend',`<div class="mt-3 border-t border-line pt-3"><div class="flex items-center justify-between"><b class="text-sm">🎙️ ملاحظات صوتية</b><button data-v="vrec" data-id="${id}" id="vrb" class="text-xs bg-acc/15 text-acc rounded-lg px-3 py-1.5">تسجيل ٣٠ ثانية</button></div><div id="vl" class="mt-2 space-y-2"></div></div>`);vlist(id)}};

/* 8) جدول الخدمة (الدور) */
const RS=()=>S.roster=S.roster||{roles:['تحضير','درس','ألحان','استقبال'],day:5,a:{}};
const rdates=()=>{const r=RS(),o=[],t=now();t.setDate(t.getDate()+(r.day-t.getDay()+7)%7);for(let i=0;i<4;i++){o.push(ds(t));t.setDate(t.getDate()+7)}return o};
const rEmpty=d=>{const r=RS();return r.roles.filter(x=>!(r.a[d]||{})[x])};
const rText=()=>{const r=RS(),sv=S.servants||[];return '📅 جدول الخدمة\n'+rdates().map(d=>arDate(dd(d))+'\n'+r.roles.map(x=>'• '+x+': '+((sv.find(s=>s.id===(r.a[d]||{})[x])||{}).name||'—')).join('\n')).join('\n\n')};
const vRoster=()=>{const r=RS(),sv=S.servants||[];if(!sv.length)return '<p class="text-center text-mute py-10">ضيف الخدام أولًا من شاشة الخدام</p>';
 return `<div class="space-y-3"><div class="${card} !mt-0"><label class="text-xs text-mute">يوم الخدمة</label><select data-vr="day" class="${inp}">${DAYS.map((n,i)=>`<option value="${i}" ${i===r.day?'selected':''}>${n}</option>`).join('')}</select></div>
 ${rdates().map(d=>{const e=rEmpty(d);return `<div class="${card}"><div class="flex justify-between"><b>${arDate(dd(d))}</b>${e.length?`<span class="text-xs text-warn">⚠️ ${e.length} فاضي</span>`:'<span class="text-xs text-ok">✓ كامل</span>'}</div>${r.roles.map(x=>`<div class="flex items-center gap-2 mt-2"><span class="w-20 text-sm shrink-0">${esc(x)}</span><select data-vr="as" data-d="${d}" data-r="${esc(x)}" class="${inp} !mt-0"><option value="">— فاضي —</option>${sv.map(s=>`<option value="${s.id}" ${(r.a[d]||{})[x]===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`).join('')}</div>`}).join('')}
 <div class="grid grid-cols-3 gap-2"><button data-v="rsh" class="bg-ok text-white font-bold rounded-xl py-3 text-xs">واتساب</button><button data-v="radd" class="border border-line rounded-xl py-3 text-xs">+ دور</button><button data-v="rdel" class="border border-line rounded-xl py-3 text-xs text-bad">حذف دور</button></div></div>`};
const rosterAlert=()=>{if(!S.roster)return '';const d=rdates()[0],n=until(dd(d)),e=rEmpty(d);return n<=7&&e.length?`<button data-go="roster" class="w-full bg-warn/10 border border-warn/40 rounded-2xl p-3 mt-3 text-start text-sm">⚠️ جدول الخدمة ${when(n)}: دور فاضي (${e.map(esc).join('، ')})</button>`:''};

/* 9) خطة قراءة الكتاب المقدس */
const CH=[['متى',28],['مرقس',16],['لوقا',24],['يوحنا',21]].flatMap(([n,c])=>Array.from({length:c},(_,i)=>n+' '+(i+1)));
const BB=()=>S.bible=S.bible||{start:ds(now()),done:{}};
const chOf=d=>CH[((Math.round((dd(d)-dd(BB().start))/864e5)%CH.length)+CH.length)%CH.length];
const bStreak=()=>{const b=BB();let c=0,t=now();if(!(b.done[ds(t)]||[]).includes('me'))t.setDate(t.getDate()-1);while((b.done[ds(t)]||[]).includes('me')){c++;t.setDate(t.getDate()-1)}return c};
const vBible=()=>{const b=BB(),t=ds(now()),dn=b.done[t]||[],me=dn.includes('me'),sv=S.servants||[];
 return `<div class="space-y-3"><div class="${card} !mt-0 text-center"><div class="text-xs text-mute">قراءة النهارده</div><div class="text-3xl font-extrabold mt-1">${chOf(t)}</div><div class="text-xs text-mute mt-1">الأناجيل الأربعة — فصل كل يوم</div><button data-v="bk" data-w="me" class="${me?'bg-ok/20 text-ok':'bg-acc text-white'} font-bold rounded-xl py-3 w-full mt-3">${me?'✓ قرأت النهارده':'علّم إنك قرأت'}</button><div class="mt-2 text-sm">🔥 ${bStreak()} يوم ورا بعض</div></div>
 ${sv.length?`<div class="${card}"><h2 class="font-bold mb-2">الخدام — ${dn.filter(x=>x!=='me').length} من ${sv.length}</h2>${sv.map(x=>`<label class="flex items-center gap-3 py-1.5"><input type="checkbox" class="w-5 h-5" data-v="bk" data-w="${x.id}" ${dn.includes(x.id)?'checked':''}><span>${esc(x.name)}</span></label>`).join('')}<button data-v="bks" class="${BO} mt-3">📤 تذكير واتساب للخدام</button></div>`:''}</div>`};

/* ===== ربط الشاشات ===== */
const SUB={wsum:['ملخص الأسبوع نصًا',vWsum],mgrid:['تقويم الشهر',vMgrid],joinqr:['QR الانضمام',vJoin],roster:['جدول الخدمة',vRoster],bible:['خطة القراءة',vBible]};
Object.keys(SUB).forEach(k=>SUBT[k]=SUB[k][0]);
const menu=()=>[['wsum','📤','ملخص الأسبوع نصًا','رسالة جاهزة لأمين الخدمة أو جروب الخدام'],['mgrid','📅','تقويم الشهر','كل المناسبات في شبكة واحدة'],['roster','🗓️','جدول الخدمة','مين بيخدم إيه كل أسبوع'],['bible','📖','خطة القراءة','فصل كل يوم مع سلسلة أيام'],['joinqr','🔳','QR الانضمام','كود للخدام الجداد']]
 .map(([k,i,t,s])=>`<button data-go="${k}" class="w-full bg-card border border-line rounded-2xl p-4 flex items-center gap-3 text-start"><div class="w-11 h-11 rounded-xl bg-acc/15 grid place-items-center text-xl">${i}</div><div class="flex-1"><div class="font-bold">${t}</div><div class="text-xs text-mute">${s}</div></div></button>`).join('');
const _vm=vMore;vMore=function(){if(SUB[ui.sub])return SUB[ui.sub][1]();const h=_vm();return h};
window.K=window.K||{};K.chOf=chOf;K.pray=pray;K.cd=cdItems;K.when=when;K.rosterInfo=()=>{if(!S.roster)return null;const d=rdates()[0],n=until(dd(d)),e=rEmpty(d);return n<=7&&e.length?{n,e}:null};

document.addEventListener('click',async e=>{const b=e.target.closest('[data-v]');if(!b)return;const D=b.dataset,a=D.v,t=ds(now());
 if(a==='wsw')wsh($('#wst').value);
 else if(a==='wsc')cp($('#wst').value);
 else if(a==='pray')noteSheet(D.id);
 else if(a==='mg'){ui.mgo=(ui.mgo||0)+(+D.n);render()}
 else if(a==='mday'){ui.mgd=D.d;render()}
 else if(a==='jsh')wsh('سلام ونعمة 🙏\nرابط برنامج الخدمة: '+location.origin+location.pathname);
 else if(a==='jpr'){const i=$('#jq');if(!i||!i.src)return toast('استنى الكود يظهر');const w=window.open('','_blank');if(w){w.document.write(`<body style="text-align:center;font-family:sans-serif"><h2>انضم لخدمة الكنيسة</h2><img src="${i.src}" width="300"><p dir="ltr">${esc(location.origin+location.pathname)}</p><\/body>`);w.document.close();w.print()}}
 else if(a==='cr'){crSel=D.x;document.querySelectorAll('.cr').forEach(x=>x.classList.remove('bg-acc','text-white'));b.classList.add('bg-acc','text-white')}
 else if(a==='crs'){const tx=($('#crt').value||'').trim();if(!crSel&&!tx)return toast('اختار النتيجة أو اكتب ملاحظة');(S.notes[D.id]=S.notes[D.id]||[]).push({ts:Date.now(),type:'اتصال',text:[crSel,tx].filter(Boolean).join(' — ')});save();$('#sheet').classList.add('hidden');toast('اتسجلت في ملاحظاته ✓')}
 else if(a==='vrec')vrec(D.id);
 else if(a==='vdel'){if(confirm('حذف التسجيل؟')){await vrm(D.k);vlist(D.mid)}}
 else if(a==='bk'){const bb=BB(),arr=bb.done[t]=bb.done[t]||[],i=arr.indexOf(D.w);i<0?arr.push(D.w):arr.splice(i,1);save();render()}
 else if(a==='bks')wsh('📖 قراءة النهارده: '+chOf(t)+' — ✓ علّم إنك قرأت في البرنامج 🙏');
 else if(a==='rsh')wsh(rText());
 else if(a==='radd'){const n=(prompt('اسم الدور الجديد؟')||'').trim();if(n&&!RS().roles.includes(n)){RS().roles.push(n);save();render()}}
 else if(a==='rdel'){const r=RS(),n=(prompt('اكتب اسم الدور اللي هيتحذف:\n'+r.roles.join('، '))||'').trim();if(r.roles.includes(n)){r.roles=r.roles.filter(x=>x!==n);save();render()}}
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-vr]');if(!s)return;const r=RS();if(s.dataset.vr==='day')r.day=+s.value;else(r.a[s.dataset.d]=r.a[s.dataset.d]||{})[s.dataset.r]=s.value;save();render()});
})();
</script>

<script>
/* ===== v28b: السنكسار (بحث + سنكسار اليوم) — البيانات في synaxarium.json وتتخزّن على الجهاز ===== */
(()=>{
const MN=['توت','بابه','هاتور','كيهك','طوبة','أمشير','برمهات','برمودة','بشنس','بؤونة','أبيب','مسرى','النسيء'],
 SY={d:null,busy:0},
 nrm=s=>String(s).replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه'),
 db=()=>new Promise((res,rej)=>{const r=indexedDB.open('kenisty_syn',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}),
 idbGet=async()=>{const d=await db();return new Promise(res=>{const q=d.transaction('k').objectStore('k').get('all');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})},
 idbSet=async v=>{const d=await db();return new Promise(res=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,'all');t.oncomplete=res;t.onerror=res})};
async function synLoad(){if(SY.d||SY.busy)return;SY.busy=1;
 try{let v=await idbGet();if(!v){const r=await fetch('synaxarium.json');if(!r.ok)throw 0;v=await r.json();idbSet(v).catch(()=>{})}SY.d=v;SY.idx=null}catch(_){toast('محتاج إنترنت مرة واحدة لتحميل السنكسار');SY.fail=1}
 SY.busy=0;if(ui.tab==='more'&&ui.sub==='synax')render()}
const dayAt=o=>{const t=new Date();t.setHours(12,0,0,0);t.setDate(t.getDate()+o);return t};
const keyAt=o=>{const c=copOf(dayAt(o));return{k:c.m+'-'+c.d,c}};
const synToday=()=>SY.d?(SY.d[keyAt(0).k]||[]):[];
const synCard=()=>{const{c}=keyAt(0),l=synToday();return `<button data-go="synax" class="w-full bg-card border border-line rounded-2xl p-4 mt-3 flex items-center gap-3 text-start"><div class="text-2xl">🕊️</div><div class="flex-1 min-w-0"><div class="text-xs text-mute">سنكسار اليوم — ${c.d} ${MN[c.m-1]}</div><div class="font-bold text-sm truncate">${l.length?esc(l.map(x=>x[0]).join(' • ')):'اضغط لعرض سنكسار اليوم'}</div></div><span class="text-xs text-acc">›</span></button>`};
function search(q){q=nrm(q.trim());if(q.length<2)return[];if(!SY.idx)SY.idx=Object.entries(SY.d).flatMap(([k,l])=>l.map(e=>({k,n:e[0],nn:nrm(e[0]),t:nrm(e[1])})));
 const a=SY.idx.filter(x=>x.nn.includes(q)),b=SY.idx.filter(x=>!x.nn.includes(q)&&x.t.includes(q));return a.concat(b).slice(0,30)}
function vSyn(){if(!SY.d){if(!SY.fail)synLoad();return `<p class="text-center text-mute py-10">${SY.fail?'تعذّر تحميل السنكسار — اتأكد إن ملف synaxarium.json مرفوع جنب index.html وفيه إنترنت':'جاري التحميل…'}</p>`}
 const o=ui.syo||0,{k,c}=keyAt(o),l=SY.d[k]||[],q=ui.syq||'',res=q?search(q):null;
 return `<div class="space-y-3"><div class="flex gap-2"><input id="syq" value="${esc(q)}" placeholder="ابحث باسم القديس أو كلمة" class="flex-1 bg-card border border-line rounded-xl px-3 py-2.5"><button data-sy="find" class="bg-acc text-white font-bold rounded-xl px-4">بحث</button></div>

<script>
/* ===== v29: مؤشر الغياب • الاعتراف والتناول • رسالة ولي الأمر • الكتاب المقدس • قطمارس • أجبية ===== */
(()=>{

  if(!v){const r=await fetch(n+'.json');if(!r.ok)throw 0;v=await r.json();await new Promise(res=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,n);t.oncomplete=res;t.onerror=res})}

/* ---- 1) مؤشر خطر الغياب ---- */
const rate=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length*100:0;

const vRisk=()=>{const l=risks();return l.length?`<div class="space-y-3">${l.map(({m,lv,why})=>`<div class="bg-card border ${lv===2?'border-bad/40':'border-warn/40'} rounded-2xl p-3"><div class="flex items-center gap-2"><span>${lv===2?'🔴':'🟠'}</span><b class="flex-1 truncate sens">${esc(m.name)}</b><span class="text-xs text-mute">${esc(svcName(m.sid))}</span></div><div class="text-xs text-mute mt-1">${why.map(esc).join(' · ')}</div><div class="grid grid-cols-3 gap-2 mt-2"><a href="tel:${esc(m.phone||'')}" class="text-center bg-acc/15 text-acc rounded-xl py-2 text-sm ${m.phone?'':'opacity-30 pointer-events-none'}">اتصال</a><a href="${wa(m.phone)}?text=${encodeURIComponent('سلام ونعمة يا '+m.name.split(' ')[0]+' 🙏 وحشتنا في الاجتماع، ربنا يطمّنك عليك')}" target="_blank" rel="noopener" class="text-center bg-ok/15 text-ok rounded-xl py-2 text-sm ${m.phone?'':'opacity-30 pointer-events-none'}">واتساب</a><button data-z="mopen" data-id="${m.id}" class="border border-line rounded-xl py-2 text-sm">الملف</button></div></div>`).join('')}</div>`:'<p class="text-center text-mute py-10">مفيش حد معرّض للغياب دلوقتي 🙏</p>'};

const vConf=()=>{try{const c=JSON.parse(localStorage.getItem('kenisty_conf')||'{}');CONF=+c.c||45;COMM=+c.m||30}catch(_){}const f=ui.cf||'all';let l=S.members.map(m=>({m,c:since(m.conf),k:since(m.comm)}));

 l.sort((a,b)=>(b.c===null?9999:b.c)-(a.c===null?9999:a.c));
 return `<div class="space-y-3"><div class="${card} !mt-0 text-xs text-mute">بيانات حساسة. المتأخر = اعتراف أكتر من ${CONF} يوم أو تناول أكتر من ${COMM} يوم، وبتختفي الأسماء في «وضع الخصوصية».</div>

 ${l.map(({m,c,k})=>`<div class="bg-card border border-line rounded-2xl p-3"><b class="sens">${esc(m.name)}</b>
 <div class="grid grid-cols-2 gap-2 mt-2 text-xs"><div class="bg-bg rounded-xl p-2"><div class="text-mute">آخر اعتراف</div><div class="font-bold ${c===null||c>CONF?'text-warn':'text-ok'}">${dtx(c)}</div><button data-z="ce" data-id="${m.id}" class="text-acc mt-1">✓ النهارده</button> <button data-z="ced" data-id="${m.id}" class="text-mute">تاريخ</button></div>

/* ---- 3) رسالة ولي الأمر ---- */
const gTxt=m=>{const a=(m.att||[]).slice(-4),x=a.reduce((p,c)=>p+c,0),who=m.gname?'أستاذ/ة '+m.gname.split(' ')[0]:'ولي الأمر الفاضل';
 return `سلام ونعمة 🙏\n${who}،\nحابين نطمّنكم على ${m.name.split(' ')[0]}: حضر ${x} من آخر ${a.length} اجتماعات${x===a.length&&a.length?' — ما شاء الله مواظب جدًا 🌟':x===0?' — وحشنا جدًا ونتمنى نشوفه قريب':''}.\nربنا يبارك فيه وفي حضراتكم ✝️`};

const KT={},kdate=o=>{const t=now();t.setDate(t.getDate()+o);return t},kstr=t=>String(t.getDate()).padStart(2,'0')+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+t.getFullYear(),

 const nav=`<div class="flex items-center justify-between"><button data-z="qn" data-n="-1" class="w-10 h-10 rounded-xl bg-card border border-line">›</button><div class="text-center"><b>${c.d} ${MNm[c.m-1]}</b><div class="text-xs text-mute">${arDate(t)}</div></div><button data-z="qn" data-n="1" class="w-10 h-10 rounded-xl bg-card border border-line">‹</button></div>`;

async function init(){if(LIB.busy||LIB.meta)return;LIB.busy=1;
 try{LIB.meta=(await kget('lib:meta'))||{}}catch(_){LIB.meta={}}
 for(const d of['books/','booxs/']){try{const r=await fetch(d+'index.json?t='+Date.now(),{cache:'no-store'});if(r.ok){LIB.remote=(await r.json()).books||[];LIB.rerr=0;DIR=d;break}else LIB.rerr=1}catch(_){LIB.rerr=1}}
 LIB.busy=0;rr()}
async function loadCur(id){CUR={id,book:null};try{CUR.book=await kget('lib:book:'+id)}catch(_){}rr()}
async function save(book,from){if(!book.sections.length)throw new Error('مفيش أقسام');
 let id=book.id||('b'+Date.now().toString(36));while(LIB.meta[id]&&from!=='github')id+='x';book.id=id;
 await kput('lib:book:'+id,book);LIB.meta[id]={title:book.title,author:book.author||'',n:book.sections.length,from};await kput('lib:meta',LIB.meta);return id}

/* ---- تقسيم النص لأقسام (نفس منطق books_build.py) ---- */
function splitText(raw){let t=String(raw).replace(/\r\n?/g,'\n');
 if(/<(p|div|br|h\d|body)\b/i.test(t)){t=t.replace(/<(script|style)[^>]*>[\s\S]*?<\/\1>/gi,' ').replace(/<br\s*\/?>|<\/(p|div|h\d|li|tr|td)>/gi,'\n');t=new DOMParser().parseFromString(t,'text/html').body.textContent||''}
 const L=t.split('\n').map(x=>x.replace(/\s+/g,' ').trim());
 const isH=l=>l&&l.length<=90&&(/^#{1,3}\s*\S/.test(l)||/^\d{1,3}\s*[-–.)]\s*\S/.test(l)||(/^(كلمة|الكلمة|الفصل|الباب|الأصحاح|مقال|المقال)\s+\S+/.test(l)&&l.length<=60));
 const blanks=L.filter(x=>!x).length,sep=blanks/Math.max(1,L.length-blanks)>=0.3;
 const paras=[];let buf='';
 const flush=()=>{if(buf)paras.push(buf);buf=''};
 for(const l of L){if(!l){flush();continue}if(isH(l)){flush();paras.push({h:l.replace(/^#+\s*/,'').replace(/^\d{1,3}\s*[-–.)]\s*/,'')});continue}if(sep)buf=buf?buf+' '+l:l;else paras.push(l)}
 flush();
 const hs=paras.filter(p=>p.h).length,secs=[];
 if(hs>=3){let cur=null;for(const p of paras){if(p.h){if(cur&&cur.t)secs.push(cur);cur={h:p.h,t:''}}else if(cur)cur.t+=(cur.t?'\n\n':'')+p}if(cur&&cur.t)secs.push(cur)}
 else{let cur='',n=1;for(const p of paras){const s=p.h?p.h:p;if((cur+s).length>1500&&cur){secs.push({h:'جزء '+n++,t:cur.trim()});cur=''}cur+=(cur?'\n\n':'')+s}if(cur.trim())secs.push({h:'جزء '+n,t:cur.trim()})}
 return secs.filter(s=>s.t)}
const fromJSON=(o,title)=>{const secs=Array.isArray(o)?o:o.sections;if(!Array.isArray(secs)||!secs.length)throw new Error('الملف مش بصيغة الكتاب');
 return{id:o.id,title:o.title||title,author:o.author||'',src:o.src||'',sections:secs.map((s,i)=>({h:String(s.h||'قسم '+(i+1)),t:String(s.t||s.text||'')})).filter(s=>s.t)}};
async function decode(file){const buf=await file.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\ufffd')){try{t=new TextDecoder('windows-1256').decode(buf)}catch(_){}}return t}
async function addFromText(txt,name,from){let book;const s=txt.trim();
 if(s[0]==='{'||s[0]==='['){try{book=fromJSON(JSON.parse(s),name)}catch(e){if(s[0]==='{')throw e}}
 if(!book)book={title:name,author:'',src:'',sections:splitText(txt)};
 return save(book,from)}
