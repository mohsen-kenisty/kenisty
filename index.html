const vTasks=()=>{const f=ui.tf||'open',T=xa('tasks'),L=[...T].sort((a,b)=>(a.done-b.done)||((a.due||'9')<(b.due||'9')?-1:1)).filter(t=>f==='open'?!t.done:f==='over'?tOver(t):f==='done'?t.done:true);
 return `<div class="space-y-3"><button data-z35="tkadd" class="${BT}">+ مهمة جديدة</button><div class="flex flex-wrap gap-2">${chip(f==='open','tkf','open','مفتوحة ('+T.filter(t=>!t.done).length+')')}${chip(f==='over','tkf','over','متأخرة ('+T.filter(tOver).length+')')}${chip(f==='done','tkf','done','خلصت')}${chip(f==='all','tkf','all','الكل')}</div>
 ${L.map(t=>`<div class="bg-card border ${tOver(t)?'border-bad/50':'border-line'} rounded-2xl p-3 flex items-start gap-3"><button data-z35="tkt" data-id="${t.id}" class="text-2xl shrink-0">${t.done?'✅':'⬜'}</button><div class="flex-1 min-w-0"><div class="${t.done?'line-through text-mute':''}">${esc(t.text)}</div><div class="text-xs text-mute mt-1">${t.sv?esc(svName(t.sv))+' · ':''}${t.due?(tOver(t)?'⚠️ ':'')+t.due:'بدون ميعاد'}</div></div><button data-z35="tkdel" data-id="${t.id}" class="text-bad px-1">🗑</button></div>`).join('')||empty('مفيش مهام هنا.')}</div>`};

/* ---- 6) الأسر ---- */
const vFam=()=>{const F=xa('fam');return `<div class="space-y-3"><button data-z35="fmadd" class="${BT}">+ أسرة جديدة</button>${F.map(f=>{const ms=f.m.map(id=>S.members.find(m=>m.id===id)).filter(Boolean);return `<div class="bg-card border border-line rounded-2xl p-3"><div class="flex justify-between"><b>${esc(f.name)}</b><span class="text-xs text-mute">${ms.length} أفراد</span></div><div class="text-sm text-mute mt-1 sens">${ms.map(m=>esc(m.name.split(' ')[0])).join('، ')||'—'}</div><div class="flex gap-2 mt-2"><button data-z35="fmmsg" data-id="${f.id}" class="flex-1 bg-ok/15 text-ok rounded-xl py-2 text-sm font-bold">💌 رسالة للأسرة</button><button data-z35="fmedit" data-id="${f.id}" class="px-3 rounded-xl border border-line text-sm">تعديل</button><button data-z35="fmdel" data-id="${f.id}" class="px-3 rounded-xl border border-line text-bad">🗑</button></div></div>`}).join('')||empty('اربط الإخوة بنفس الأسرة، وابعت رسالة واحدة للأسرة كلها.')}</div>`};
const fmForm=f=>{f=f||{m:[]};sheet(`<div class="max-h-[85vh] overflow-y-auto"><h2 class="font-extrabold mb-2">${f.id?'تعديل':'أسرة'} أسرة</h2><input id="fm_n" value="${esc(f.name||'')}" placeholder="اسم الأسرة (مثلًا: أسرة مينا)" class="${inp}"><div class="mt-2 space-y-1">${[...S.members].sort((a,b)=>a.name<b.name?-1:1).map(m=>`<label class="flex items-center gap-3 bg-card border border-line rounded-xl px-3 py-2"><input type="checkbox" class="fmc w-5 h-5" value="${m.id}" ${f.m.includes(m.id)?'checked':''}><span class="sens">${esc(m.name)}</span></label>`).join('')}</div><button data-z35="fmsave" data-id="${f.id||''}" class="${BT} mt-3">حفظ</button></div>`)};
const famMsg=f=>{const ms=f.m.map(id=>S.members.find(m=>m.id===id)).filter(Boolean),ph=(ms.find(m=>m.phone)||{}).phone;
 const lines=ms.map(m=>{const a=(m.att||[]).slice(-4),x=a.reduce((p,c)=>p+c,0);return '• '+m.name.split(' ')[0]+': '+x+' من '+a.length});
 return{ph,txt:'سلام ونعمة 🙏\nأسرة '+f.name.replace(/^أسرة\s*/,'')+' الفاضلة،\nحضور أولادكم في آخر اجتماعات:\n'+lines.join('\n')+'\nربنا يبارك فيهم وفيكم ✝️'}};

/* ---- 7) نجوم المواظبة ---- */
const streakOf=m=>{const a=m.att||[];let c=0;for(let i=a.length-1;i>=0&&a[i]===1;i--)c++;return c};
const badges=(m)=>{const s=streakOf(m),b=[];if(s>=4)b.push('🌟');if(s>=8)b.push('🏅');if(s>=12)b.push('🏆');const st=(xo('stars')[m.id])||0;if(st)b.push('⭐×'+st);return b.join(' ')};
const rate8=m=>{const a=(m.att||[]).slice(-8);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*100):0};
const vStars=()=>{const L=[...S.members].filter(m=>(m.att||[]).length).map(m=>({m,s:streakOf(m),r:rate8(m)})).sort((a,b)=>b.s-a.s||b.r-a.r),top=L[0];
 return `<div class="space-y-3">${top?`<div class="${card} !mt-0 text-center" style="background:linear-gradient(135deg,#3b2f0f,#1f1a0a);border:1px solid rgba(216,183,101,.4)"><div class="text-xs" style="color:#d8b765">نجم المواظبة</div><div class="text-2xl font-extrabold mt-1 sens">${esc(top.m.name)}</div><div class="text-sm text-mute">${top.s} أسبوع ورا بعض · ${top.r}% في آخر 8</div></div>`:''}
 <div class="text-xs text-mute">🌟 4 أسابيع ورا بعض · 🏅 8 · 🏆 12 · ⭐ نجمة تضيفها إنت</div>
 ${L.map(({m,s,r},i)=>`<div class="bg-card border border-line rounded-xl px-3 py-2.5 flex items-center gap-3"><span class="w-6 text-center text-mute text-sm">${i+1}</span><div class="flex-1 min-w-0"><div class="truncate sens">${esc(m.name)}</div><div class="text-xs text-mute">${s} ورا بعض · ${r}%</div></div><span class="text-sm">${badges(m)}</span><button data-z35="starp" data-id="${m.id}" class="w-8 h-8 rounded-lg border border-line text-sm">+⭐</button></div>`).join('')||empty('سجّل حضور جلسات الأول.')}
 ${L.length?`<button data-z35="starshare" class="${BO}">📤 مشاركة نجوم الأسبوع</button>`:''}</div>`};

/* ---- 8) بحث شامل ---- */
const vGs=()=>{const q=(ui.gq||'').trim(),n=nrm(q);
 let h=`<div class="space-y-3"><div class="flex gap-2"><input id="gsq" value="${esc(q)}" placeholder="ابحث في كل البرنامج…" class="flex-1 bg-card border border-line rounded-xl px-3 py-2.5"><button data-z35="gs" class="bg-acc text-white font-bold rounded-xl px-4">بحث</button></div>`;
 if(n.length<2)return h+empty('اكتب اسم مخدوم أو رقم تليفون أو كلمة من ملاحظة أو طلب صلاة أو مهمة.')+'</div>';
 const has=t=>nrm(t||'').includes(n),sec=(t,rows)=>rows.length?`<div><b class="block mb-1">${t} (${rows.length})</b><div class="space-y-1">${rows.join('')}</div></div>`:'',row=(a,id,t,s)=>`<button data-z35="${a}" data-id="${id}" class="w-full bg-card border border-line rounded-xl px-3 py-2.5 text-start"><div class="text-sm sens">${esc(t)}</div>${s?`<div class="text-xs text-mute truncate">${esc(s)}</div>`:''}</button>`;
 const mem=S.members.filter(m=>has(m.name)||has(m.phone)||has(m.gname)).slice(0,15).map(m=>row('gsm',m.id,m.name,m.phone||''));
 const notes=[];Object.keys(S.notes||{}).forEach(id=>{const m=S.members.find(x=>x.id===id);if(m)(S.notes[id]||[]).forEach(x=>{if(has(x.text))notes.push(row('gsm',id,m.name,String(x.text).slice(0,90)))})});
 const pr=xa('prayers').filter(p=>has(p.text)).slice(0,10).map(p=>row('gsp',p.id,p.text.slice(0,70),p.done?'استجاب الله':'مفتوح'));
 const tk=xa('tasks').filter(t=>has(t.text)).slice(0,10).map(t=>row('gst',t.id,t.text,t.due||''));
 const ls=xa('lessons').filter(x=>has(x.topic)||has(x.verse)||has(x.acts)).slice(0,10).map(x=>row('gsl',x.id,x.topic||x.verse,x.date));
 const wd=[...(S.words||[]),...(window.SHARED_WORDS||[])].filter(w=>has(w.text)).slice(0,8).map(w=>row('gsw','',w.text.slice(0,80),w.ref||''));
 const body=sec('المخدومين',mem)+sec('الملاحظات',notes.slice(0,15))+sec('طلبات الصلاة',pr)+sec('المهام',tk)+sec('خطط الدروس',ls)+sec('الكلمات',wd);
 return h+(body||empty('مفيش نتائج.'))+`<button data-z35="gsb" class="${BO}">📜 ابحث عن «${esc(q)}» في الكتاب المقدس</button></div>`};

/* ---- تسجيل الشاشات ---- */
const SUB={mem:['حفظ الآيات',vMem],prayreq:['طلبات الصلاة',vPray],refl:['تأمل الخدام',vRefl],lesson:['خطة الدرس الأسبوعي',vLesson],tasks:['مهام الخدام',vTasks],fam:['الأسر',vFam],stars:['نجوم المواظبة',vStars],gsearch:['بحث شامل',vGs]};
Object.keys(SUB).forEach(k=>SUBT[k]=SUB[k][0]);
const _vm=vMore;vMore=function(){if(SUB[ui.sub])return SUB[ui.sub][1]();return _vm()};

/* ---- الشاشة الرئيسية: تنبيهات مهمة بس ---- */
const bakAge=()=>{try{const l=localStorage.getItem('kenisty_lastbak');if(!l){const f=localStorage.getItem('kenisty_firstuse')||td();localStorage.setItem('kenisty_firstuse',f);return Math.round((Date.now()-new Date(f+'T12:00:00'))/864e5)}return Math.round((Date.now()-new Date(l+'T12:00:00'))/864e5)}catch(_){return 0}};
const banner=(c,html)=>`<div class="rounded-2xl p-3 mt-3 text-sm" style="background:${c[0]};border:1px solid ${c[1]}">${html}</div>`;
const _vh=vHome;vHome=function(){const h=_vh();let a='';
 try{
  if(K.newVer)a+=banner(['rgba(58,178,138,.12)','rgba(58,178,138,.4)'],`<div class="font-bold">🆕 فيه نسخة جديدة من البرنامج</div><button data-z35="upd" class="${BT} mt-2 !py-2">تحديث دلوقتي</button>`);
  const to=K.tasksOver();if(to)a+=`<button data-go="tasks" class="w-full text-start">${banner(['rgba(239,68,68,.1)','rgba(239,68,68,.35)'],`⚠️ ${to} مهمة متأخرة <span class="text-acc">›</span>`)}</button>`;
  if(bakAge()>=7&&S.members.length)a+=banner(['rgba(245,158,11,.1)','rgba(245,158,11,.4)'],`<div class="font-bold">💾 عدّى ${bakAge()} يوم من آخر نسخة احتياطية</div><div class="grid grid-cols-2 gap-2 mt-2"><button data-sub="bak" class="${BO} !py-2">افتح النسخ</button><button data-z35="bakok" class="${BO} !py-2">عملتها ✓</button></div>`);
 }catch(_){}
 return a?h.replace(/^\s*<div class="text-sm text-mute">[^<]*<\/div>/,m=>m+a):h};
async function checkVer(){try{const r=await fetch('index.html?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text(),m=t.match(/const APPV='([^']+)'/);if(m&&m[1]!==APPV){K.newVer=1;if(ui.tab==='home'||!ui.tab)try{render()}catch(_){}}}catch(_){}}
setTimeout(checkVer,6000);

/* ---- التفاعل ---- */
const act=async(a,D)=>{const t=td();
 if(a==='memt'){const v=weekVerse(),M=xo('mem');const arr=M[v.w]=M[v.w]||[],i=arr.indexOf(D.id);i<0?arr.push(D.id):arr.splice(i,1);save();render()}
 else if(a==='memshare'){const v=weekVerse();wsh('📖 آية الأسبوع للحفظ\n\n«'+v.text+'»\n'+v.ref+'\n\nمين يحفظها ويقولها في الاجتماع؟ 🙏')}
 else if(a==='prf'){ui.pf=D.k;render()}
 else if(a==='pradd')sheet(`<div><h2 class="font-extrabold mb-2">طلب صلاة</h2><textarea id="pr_t" rows="4" placeholder="اكتب الطلب (حاجة عامة بدون تفاصيل حساسة)" class="${inp}"></textarea><input id="pr_w" placeholder="من/عن (اختياري)" class="${inp} mt-2"><button data-z35="prsave" class="${BT} mt-3">حفظ</button></div>`)
 else if(a==='prsave'){const x=val('pr_t');if(!x)return toast('اكتب الطلب');xa('prayers').push({id:uid(),text:x,who:val('pr_w'),ts:Date.now(),c:0,done:0});save();closeS();render()}
 else if(a==='prpray'){const p=xa('prayers').find(x=>x.id===D.id);if(p){p.c=(p.c||0)+1;save();render()}}
 else if(a==='prdone'){const p=xa('prayers').find(x=>x.id===D.id);if(p){p.done=p.done?0:1;save();render()}}
 else if(a==='prdel'){if(confirm('حذف الطلب؟')){X().prayers=xa('prayers').filter(x=>x.id!==D.id);save();render()}}
 else if(a==='rfadd'){if(!myName()){const n=(prompt('اسمك (هيظهر جنب تأملك):')||'').trim();if(!n)return;try{localStorage.setItem('kenisty_myname',n)}catch(_){}}
  sheet(`<div><h2 class="font-extrabold mb-1">تأملي في ${esc((K.chOf&&K.chOf(t))||'أصحاح النهارده')}</h2><textarea id="rf_t" rows="4" placeholder="سطرين عن اللي لمسك في الأصحاح" class="${inp}"></textarea><button data-z35="rfsave" class="${BT} mt-3">حفظ</button></div>`)}
 else if(a==='rfsave'){const x=val('rf_t');if(!x)return toast('اكتب تأملك');const R=xo('refl');(R[t]=R[t]||[]).push({n:myName(),t:x,ts:Date.now()});save();closeS();render()}
 else if(a==='rfshare'){const R=(xo('refl')[t]||[]);wsh('✍️ تأملات الخدام — '+((K.chOf&&K.chOf(t))||'')+'\n\n'+R.map(r=>'• '+(r.n?r.n+': ':'')+r.t).join('\n\n'))}
 else if(a==='lsadd')lsForm();
 else if(a==='lsedit')lsForm(xa('lessons').find(x=>x.id===D.id));
 else if(a==='lssave'){const o={date:val('ls_d')||nextSvc(),topic:val('ls_t'),verse:val('ls_v'),acts:val('ls_a'),notes:val('ls_n'),sv:val('ls_s')};if(!o.topic)return toast('اكتب موضوع الدرس');const L=xa('lessons');if(D.id)Object.assign(L.find(x=>x.id===D.id),o);else L.push({id:uid(),...o});save();closeS();render()}
 else if(a==='lsdel'){if(confirm('حذف الخطة؟')){X().lessons=xa('lessons').filter(x=>x.id!==D.id);save();render()}}
 else if(a==='lsshare'){const x=xa('lessons').find(y=>y.id===D.id);wsh('📝 خطة الدرس — '+x.date+'\nالموضوع: '+x.topic+(x.verse?'\nالآية: '+x.verse:'')+(x.acts?'\nالأنشطة: '+x.acts:'')+(x.sv?'\nالخادم: '+svName(x.sv):'')+(x.notes?'\nملاحظات: '+x.notes:''))}
 else if(a==='tkf'){ui.tf=D.k;render()}
 else if(a==='tkadd'){const sv=(S.servants||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');sheet(`<div><h2 class="font-extrabold mb-2">مهمة جديدة</h2><textarea id="tk_t" rows="3" placeholder="المهمة" class="${inp}"></textarea><select id="tk_s" class="${inp} mt-2"><option value="">— على مين؟ —</option>${sv}</select><label class="text-xs text-mute block mt-2">الميعاد<input id="tk_d" type="date" class="${inp}"></label><button data-z35="tksave" class="${BT} mt-3">حفظ</button></div>`)}
 else if(a==='tksave'){const x=val('tk_t');if(!x)return toast('اكتب المهمة');xa('tasks').push({id:uid(),text:x,sv:val('tk_s'),due:val('tk_d'),done:0});save();closeS();render()}
 else if(a==='tkt'){const x=xa('tasks').find(y=>y.id===D.id);if(x){x.done=x.done?0:1;save();render()}}
 else if(a==='tkdel'){if(confirm('حذف المهمة؟')){X().tasks=xa('tasks').filter(x=>x.id!==D.id);save();render()}}
 else if(a==='fmadd')fmForm();
 else if(a==='fmedit')fmForm(xa('fam').find(x=>x.id===D.id));
 else if(a==='fmsave'){const n=val('fm_n');if(!n)return toast('اكتب اسم الأسرة');const m=[...document.querySelectorAll('.fmc:checked')].map(c=>c.value),F=xa('fam');if(D.id){const f=F.find(x=>x.id===D.id);f.name=n;f.m=m}else F.push({id:uid(),name:n,m});save();closeS();render()}
 else if(a==='fmdel'){if(confirm('حذف الأسرة (الأفراد مش بيتمسحوا)؟')){X().fam=xa('fam').filter(x=>x.id!==D.id);save();render()}}
 else if(a==='fmmsg'){const f=xa('fam').find(x=>x.id===D.id),r=famMsg(f);wsh(r.txt,r.ph)}
 else if(a==='starp'){const S2=xo('stars');S2[D.id]=(S2[D.id]||0)+1;save();render();toast('⭐ اتضافت')}
 else if(a==='starshare'){const L=[...S.members].filter(m=>(m.att||[]).length).map(m=>({m,s:streakOf(m)})).sort((a,b)=>b.s-a.s).slice(0,5);wsh('🌟 نجوم المواظبة\n\n'+L.map(({m,s},i)=>(i+1)+'. '+m.name+' — '+s+' أسبوع '+badges(m)).join('\n')+'\n\nربنا يبارك مواظبتكم 🙏')}
 else if(a==='gs'){ui.gq=val('gsq');render()}
 else if(a==='gsm')noteSheet(D.id);
 else if(a==='gsp'){ui.sub='prayreq';ui.pf='all';render()}
 else if(a==='gst'){ui.sub='tasks';ui.tf='all';render()}
 else if(a==='gsl'){ui.sub='lesson';render()}
 else if(a==='gsb'){ui.sub='bibread';ui.bq=ui.gq||'';ui.bb=null;ui.bc=null;render()}
 else if(a==='bakok'){try{localStorage.setItem('kenisty_lastbak',td())}catch(_){}render();toast('تمام ✓ هفكّرك بعد أسبوع')}
 else if(a==='upd'){try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(_){}location.reload()}};
K.act35=act;
document.addEventListener('click',e=>{const b=e.target.closest('[data-z35]');if(b)act(b.dataset.z35,b.dataset)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='gsq'){ui.gq=e.target.value.trim();render()}});
})();
</script>
</body>
</html>
