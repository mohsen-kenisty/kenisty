<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121824">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>كنيستي القبطية 3</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700&family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Tajawal','system-ui','sans-serif']},
 colors:{bg:'rgb(var(--bg) / <alpha-value>)',card:'rgb(var(--card) / <alpha-value>)',line:'rgb(var(--line) / <alpha-value>)',mute:'#8b97ad',ok:'#22c55e',warn:'#f59e0b',bad:'#ef4444',acc:'rgb(var(--acc) / <alpha-value>)'}}}}
</script>
<style>
:root{--bg:18 24 36;--card:26 34 51;--line:39 49 72;--acc:79 140 255;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:rgb(var(--bg))}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgb(var(--bg));z-index:40}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #4f8cff;outline-offset:2px}
@keyframes up{from{transform:translateY(50%);opacity:.5}}.up{animation:up .22s}
.sens{transition:filter .2s}body.priv .sens{filter:blur(7px);user-select:none;pointer-events:none}
@media print{header,nav,#sync,#toast,#sheet,.np{display:none!important}html,body{background:#fff!important}*{color:#000!important;background:transparent!important;border-color:#999!important}main{padding-bottom:0!important}}#pz{display:none}body.ro [data-st],body.ro [data-a="allp"],body.ro [data-a="close"],body.ro [data-a="reopen"],body.ro [data-a="mdel"],body.ro [data-a="medit"],body.ro [data-lc="add"],body.ro [data-lc="edit"],body.ro [data-lc="del"],body.ro [data-lc="who"]{display:none!important}
html.light{color-scheme:light}html.light body{color:#0f172a}html.light .text-slate-100{color:#0f172a}html.light .text-slate-200,html.light .text-slate-300{color:#334155}html.light [class*=bg-gradient],html.light [class*=bg-gradient] *{color:#fff}html.light .bg-black\/60,html.light .bg-black\/70{background:rgba(15,23,42,.45)}@media print{body.pz-on>*:not(#pz){display:none!important}body.pz-on #pz{display:block!important}}
@media (prefers-reduced-motion:reduce){.up{animation:none}}
</style>
</head>
<body class="font-sans text-slate-100 bg-bg min-h-screen">
<header class="sticky top-[env(safe-area-inset-top,0px)] z-30 bg-bg/95 backdrop-blur border-b border-line">
 <div class="max-w-md mx-auto px-4 py-3 flex items-center gap-3" id="hd"></div>
</header>
<div id="sync" class="max-w-md mx-auto px-4 pt-2 text-[11px]"></div>
<main id="app" class="max-w-md mx-auto px-4 pt-2 pb-36"></main>

<nav class="fixed inset-x-3 bottom-[calc(12px+env(safe-area-inset-bottom,0px))] z-30 max-w-md mx-auto bg-[#0c111b] border border-line rounded-3xl p-2 flex shadow-2xl shadow-black/60" aria-label="التنقل" id="nav"></nav>
<div id="sheet" class="fixed inset-0 z-50 bg-black/60 hidden"><div id="sb" class="up absolute bottom-0 inset-x-0 max-w-md mx-auto bg-card rounded-t-3xl p-5 pb-[calc(24px+env(safe-area-inset-bottom,0px))]"></div></div>
<div id="toast" class="fixed top-[calc(70px+env(safe-area-inset-top,0px))] left-1/2 -translate-x-1/2 bg-slate-100 text-bg text-sm px-4 py-2 rounded-xl z-[60] opacity-0 transition-opacity pointer-events-none"></div>

<script>
/* ========== helpers ========== */
const $=s=>document.querySelector(s),
 esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
 hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),
 toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)};
const KEY='mina_p1';
/* ========== state (localStorage مع try/catch — بدّله بـ Firestore في الجزء ٢) ========== */
function seed(){
 const sv=[['s1','ابتدائي'],['s2','إعدادي'],['s3','اجتماع شباب']];
 const N=[['مينا عادل','s1'],['مريم سمير','s1'],['بيشوي ماهر','s1'],['كيرلس جورج','s1'],['مارتينا أيمن','s2'],['يوسف نبيل','s2'],['ماريا رأفت','s2'],['أنطونيوس هاني','s3'],['دميانة وائل','s3'],['مارك سامح','s3']];
 return{seq:N.length+1,services:sv.map(([id,name])=>({id,name})),
  members:N.map(([name,sid],i)=>({id:'MN-'+String(i+1).padStart(4,'0'),name,sid,phone:'0100'+String(1234567+i*91137).slice(0,7),
   att:Array.from({length:12},(_,w)=>((hash(name)+w*7)%10)/10<[.9,.8,.5,.2][i%4]?1:0)}))}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(_){}S=S||seed();
/* ===== أوفلاين أولًا: كل شيء يُحفظ محليًا فورًا، والمزامنة السحابية تتم لما يرجع النت =====
   FB.push: وصّل هنا Firestore الحقيقي (خارج هذه المعاينة):
   FB.push = snap => setDoc(doc(db,'orgs','main'), snap)   // لاحقًا: مستند لكل مجموعة (members / sessions / notes / reports) */
const FB={push:null};
const save=()=>{if(window.RO){toast('وضع العرض فقط — لا يمكن التعديل');setTimeout(()=>location.reload(),900);return}S.dirty=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}updSync();sync()};
async function sync(){if(window.RO||!navigator.onLine||!S.dirty||!FB.push||sync.b)return;sync.b=1;
 try{await FB.push(JSON.parse(JSON.stringify(S)));S.dirty=false;localStorage.setItem(KEY,JSON.stringify(S));toast('تمت المزامنة')}catch(_){}sync.b=0;updSync()}
function updSync(){const e=$('#sync');if(!e)return;const on=navigator.onLine;
 e.className='max-w-md mx-auto px-4 pt-2 text-[11px]';
 e.innerHTML=`<div class="flex items-center justify-between mb-1.5">${roleChip()}<span class="text-mute truncate max-w-[55%]" dir="ltr">${esc(whoAmI())}</span></div><div class="flex items-center justify-between"><button data-a="priv" class="px-2.5 py-0.5 rounded-full border ${S.priv?'border-acc text-acc bg-acc/10':'border-line text-mute'}">${S.priv?'🙈 الخصوصية مفعّلة':'👁 وضع الخصوصية'}</button><span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full ${on?'bg-ok/15 text-ok':'bg-warn/15 text-warn'}"><i class="w-1.5 h-1.5 rounded-full ${on?'bg-ok':'bg-warn'}"></i>${on?'متصل':'بدون إنترنت'} · ${S.dirty&&FB.push?'بانتظار المزامنة':'محفوظ على الجهاز'}</span></div>`}
addEventListener('online',()=>{updSync();sync()});addEventListener('offline',updSync);
let ui={tab:'home',sub:null,q:'',f:'all'};

/* ========== derived ========== */
const countOf=sid=>S.members.filter(m=>m.sid===sid).length;               // live member count
const pct=m=>m.att.length?Math.round(m.att.reduce((a,b)=>a+b,0)/m.att.length*100):null;
const tone=p=>p===null?['text-mute','bg-line']:p>=75?['text-ok','bg-ok']:p>=50?['text-warn','bg-warn']:['text-bad','bg-bad'];
const svcName=id=>S.services.find(s=>s.id===id)?.name||'—';
function wa(ph){let n=String(ph||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('0'))n='20'+n.slice(1);return 'https://wa.me/'+n}

/* ========== components ========== */
const G=[['#4f8cff','#2b5cc7'],['#f59e0b','#b45309'],['#22c55e','#15803d'],['#a855f7','#6d28d9'],['#f97316','#c2410c'],['#06b6d4','#0e7490']];
const avatar=m=>{const[a,b]=G[hash(m.name)%6];return `<div class="w-12 h-12 rounded-full grid place-items-center font-extrabold text-lg text-white shrink-0" style="${m.photo?`background:url('${m.photo.replace(/["'()\s\\]/g,c=>'%'+c.charCodeAt(0).toString(16))}') center/cover`:`background:linear-gradient(135deg,${a},${b})`}">${m.photo?'':esc(m.name.trim()[0])}</div>`};
const ICON={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 att:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 12l3 3 5-6"/>',
 mem:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.4 3.5 6"/>',
 ntf:'<path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/>',
 more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
 call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>',
 back:'<path d="M9 6l6 6-6 6"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const ic=(k,c='w-6 h-6')=>`<svg viewBox="0 0 24 24" class="${c}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
const TABS=[['home','اليوم','home'],['att','الحضور','att'],['mem','المخدومين','mem'],['ntf','التنبيهات','ntf'],['more','المزيد','more']];
const soon=t=>`<div class="mt-16 text-center text-mute"><div class="mx-auto w-16 h-16 rounded-2xl bg-card border border-line grid place-items-center text-acc mb-4">${ic(TABS.find(x=>x[0]===ui.tab)[2],'w-8 h-8')}</div><div class="text-slate-100 font-bold text-lg">${t}</div><p class="text-sm mt-1">تُبنى في الجزء الثاني</p></div>`;

/* ========== screens ========== */
function vMembers(){
 const l=S.members.filter(m=>(ui.f==='all'||m.sid===ui.f)&&(m.name.includes(ui.q)||m.id.toLowerCase().includes(ui.q.toLowerCase())));
 return `<div class="relative"><input id="q" type="search" value="${esc(ui.q)}" placeholder="ابحث بالاسم أو الكود" class="w-full bg-card border border-line rounded-2xl py-3 ps-4 pe-4 placeholder:text-mute"></div>
 <div class="flex gap-2 overflow-x-auto py-3 -mx-4 px-4">${[['all','الكل',S.members.length],...S.services.map(s=>[s.id,s.name,countOf(s.id)])].map(([id,n,c])=>
  `<button data-f="${id}" class="shrink-0 px-4 py-1.5 rounded-full text-sm border ${ui.f===id?'bg-acc border-acc text-white font-bold':'border-line text-mute bg-card'}">${esc(n)} · ${c}</button>`).join('')}</div>
 <div class="space-y-3">${l.map(m=>{const p=pct(m),[t,b]=tone(p);return `
  <article class="bg-card border border-line rounded-2xl p-3 flex items-center gap-3">${avatar(m)}
   <div data-m="${m.id}" class="min-w-0 flex-1 cursor-pointer"><div class="font-bold truncate">${esc(m.name)}${(S.notes[m.id]||[]).length?' 📝':''}</div>
    <div class="text-xs text-mute flex gap-2 items-center"><span dir="ltr" class="font-mono">${m.id}</span><span>·</span><span>${esc(svcName(m.sid))}</span></div>
    <div class="flex items-center gap-2 mt-1.5"><div class="h-1.5 flex-1 rounded-full bg-line overflow-hidden"><div class="h-full ${b}" style="width:${p??0}%"></div></div><span class="text-xs font-bold ${t}">${p===null?'—':p+'%'}</span></div></div>
   <div class="flex flex-col gap-2">
    <a href="tel:${esc(m.phone)}" aria-label="اتصال بـ ${esc(m.name)}" class="w-10 h-10 grid place-items-center rounded-xl bg-acc/15 text-acc ${m.phone?'':'opacity-30 pointer-events-none'}">${ic('call','w-5 h-5')}</a>
    <a href="${wa(m.phone)}" target="_blank" rel="noopener" aria-label="واتساب ${esc(m.name)}" class="w-10 h-10 grid place-items-center rounded-xl bg-ok/15 text-ok ${m.phone?'':'opacity-30 pointer-events-none'}">${ic('chat','w-5 h-5')}</a></div>
  </article>`}).join('')||'<p class="text-center text-mute py-10">لا يوجد نتائج</p>'}</div>`}

function vMore(){
 if(ui.sub==='plan')return vPlan();
 const sv4={bd:vBd,fu:vFu,help:vHelp,srv:vSrv,wk:vWk,pts:vPts,set:vSet,hist:vHist,month:vMonth,sup:vSup,nset:vNset,bak:vBak,lect:vLect,print:vPrint,team:vTeam,qr:vQR,year:vYear,fplan:vFplan,cal:vCal}[ui.sub];if(sv4)return sv4();
 if(ui.sub==='services')return `
  <div class="bg-card border border-line rounded-2xl p-3 flex gap-2"><input id="ns" placeholder="اسم مرحلة أو اجتماع جديد" class="flex-1 bg-bg border border-line rounded-xl px-3 py-2.5 placeholder:text-mute"><button id="adds" class="bg-acc text-white font-bold rounded-xl px-4 flex items-center gap-1">${ic('plus','w-4 h-4')}إضافة</button></div>
  <div class="space-y-3 mt-4">${S.services.map(s=>{const c=countOf(s.id),ms=S.members.filter(m=>m.sid===s.id),av=ms.map(pct).filter(x=>x!==null),a=av.length?Math.round(av.reduce((x,y)=>x+y,0)/av.length):null,[t]=tone(a);return `
   <div class="bg-card border border-line rounded-2xl p-4 flex items-center gap-3">
    <div class="w-11 h-11 rounded-xl bg-acc/15 text-acc grid place-items-center">${ic('mem','w-6 h-6')}</div>
    <div class="flex-1 min-w-0"><div class="font-bold">${esc(s.name)}</div><div class="text-xs text-mute"><span class="text-slate-100 font-bold">${c}</span> مخدوم${a!==null?` · متوسط الحضور <span class="${t} font-bold">${a}%</span>`:''}</div></div>
    <button data-open="${s.id}" class="text-xs text-acc border border-acc/40 rounded-lg px-2.5 py-1.5">عرض</button>
    <button data-del="${s.id}" aria-label="حذف ${esc(s.name)}" class="w-9 h-9 grid place-items-center rounded-lg text-bad bg-bad/10">${ic('trash','w-5 h-5')}</button></div>`}).join('')}</div>
  <p class="text-xs text-mute mt-3">يمكن حذف الخدمة فقط إذا كانت بدون مخدومين.</p>`;
 return `<div class="space-y-3">
  ${accCard()}${moreMenu()}
  <button data-sub="plan" class="w-full bg-card border border-acc/40 rounded-2xl p-4 flex items-center gap-3 text-start"><div class="w-11 h-11 rounded-xl bg-warn/15 text-warn grid place-items-center text-xl">🗺</div><div class="flex-1"><div class="font-bold">خطة البرنامج</div><div class="text-xs text-mute">ما تم وما سيُستكمل لاحقًا</div></div><span class="text-mute rotate-180">${ic('back','w-5 h-5')}</span></button>
  <button data-sub="services" class="w-full bg-card border border-line rounded-2xl p-4 flex items-center gap-3 text-start"><div class="w-11 h-11 rounded-xl bg-acc/15 text-acc grid place-items-center">${ic('mem','w-6 h-6')}</div><div class="flex-1"><div class="font-bold">الخدمات والفصول</div><div class="text-xs text-mute">${S.services.length} خدمات · ${S.members.length} مخدوم</div></div><span class="text-mute rotate-180">${ic('back','w-5 h-5')}</span></button>
  </div>`}

/* ========== PART 2: الحضور + الافتقاد + التقارير ========== */
let TODAY=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);const REAL=TODAY;
S.sess=S.sess||{};S.notes=S.notes||{};S.reports=S.reports||[];
S.members.forEach((m,i)=>{if(m.bd===undefined){const d=new Date();d.setDate(d.getDate()+[1,0,4,60,6,120,200,300,45,90][i%10]);m.bd=d.toISOString().slice(5,10)}});
const ST={p:['حاضر','bg-ok border-ok text-white'],l:['متأخر','bg-warn border-warn text-bg'],a:['غايب','bg-bad border-bad text-white'],e:['معتذر','bg-sky-500 border-sky-500 text-white']};
const day=()=>S.sess[TODAY]||(S.sess[TODAY]={}),closedToday=()=>S.reports.find(r=>r.date===TODAY),lastR=()=>S.reports.find(r=>r.date===RD)||closedToday()||S.reports[S.reports.length-1];
const arDate=(d=new Date())=>d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
const dtb=md=>{const t=new Date();t.setHours(0,0,0,0);const d=new Date(t.getFullYear(),+md.slice(0,2)-1,+md.slice(3));if(d<t)d.setFullYear(d.getFullYear()+1);return Math.round((d-t)/864e5)};
const streak=m=>{let c=0;for(let i=m.att.length-1;i>=0&&!m.att[i];i--)c++;return c};   // غياب متتالي
const counts=()=>{const d=day(),c={p:0,l:0,a:0,e:0};S.members.forEach(m=>{if(d[m.id])c[d[m.id]]++});return c};
const bdText=n=>n===0?'اليوم 🎂':n===1?'بكرة':'بعد '+n+' أيام';
const stat=(n,l,c)=>`<div class="bg-card border border-line rounded-2xl p-3 text-center"><div class="text-2xl font-extrabold ${c}">${n}</div><div class="text-[11px] text-mute">${l}</div></div>`;
const bdWa=m=>wa(m.phone)+'?text='+encodeURIComponent(`كل سنة وإنت طيب يا ${m.name.split(' ')[0]} 🎂 ربنا يبارك في عمرك ✝️`);
const alerts=()=>{const o=[];S.members.forEach(m=>{const k=streak(m),n=m.bd?dtb(m.bd):99;if(k>=2&&pf().fu)o.push({m,t:'abs',k});if(n<=1&&pf().bd)o.push({m,t:'bd',n})});return o};
const card='bg-card border border-line rounded-2xl p-4 mt-3';

/* --- حضور اليوم --- */
function vAtt(){
 const d=day(),c=counts(),cl=closedToday(),f=ui.f,l=S.members.filter(m=>f==='all'||m.sid===f);
 return `<div class="flex items-center justify-between"><div><label class="font-extrabold cursor-pointer relative">${arDate(new Date(TODAY+'T12:00'))} ▾<input type="date" id="adt" max="${REAL}" value="${TODAY}" aria-label="تاريخ الجلسة" class="absolute inset-0 opacity-0 w-full"></label><div class="text-xs ${cl?'text-ok':'text-mute'}">${cl?'الجلسة مغلقة ✓':'جلسة مفتوحة'}</div></div>${cl?'':'<button data-a="allp" class="text-xs text-ok border border-ok/40 rounded-lg px-3 py-1.5">الكل حاضر</button>'}</div>
 <div class="grid grid-cols-4 gap-2 mt-3">${stat(S.members.length,'الإجمالي','text-slate-100')}${stat(c.p+c.l,'حاضر','text-ok')}${stat(c.a,'غايب','text-bad')}${stat(c.e,'معتذر','text-sky-400')}</div>
 ${c.l?`<p class="text-xs text-warn mt-1.5">منهم ${c.l} متأخر</p>`:''}
 <div class="flex gap-2 overflow-x-auto py-3 -mx-4 px-4">${[['all','الكل',S.members.length],...S.services.map(s=>[s.id,s.name,countOf(s.id)])].map(([id,n,k])=>`<button data-f="${id}" class="shrink-0 px-4 py-1.5 rounded-full text-sm border ${f===id?'bg-acc border-acc text-white font-bold':'border-line text-mute bg-card'}">${esc(n)} · ${k}</button>`).join('')}</div>
 <div class="space-y-3">${l.map(m=>{const s=d[m.id],p=pct(m),[t]=tone(p),k=streak(m);return `<div class="bg-card border border-line rounded-2xl p-3">
  <div data-m="${m.id}" class="flex items-center gap-3 cursor-pointer">${avatar(m)}<div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(m.name)}${(S.notes[m.id]||[]).length?' 📝':''}</div><div class="text-xs text-mute"><span class="${t} font-bold">${p===null?'—':p+'%'}</span>${k>=2?` · <span class="text-bad">غاب ${k} متتالي</span>`:''}${m.bd&&dtb(m.bd)<=1?' · 🎂':''}</div></div><span class="text-xs text-acc">افتقاد ›</span></div>
  <div class="grid grid-cols-4 gap-1.5 mt-2.5">${Object.entries(ST).map(([k2,[n,cls]])=>`<button data-st="${k2}" data-id="${m.id}" ${cl?'disabled':''} class="py-2 rounded-xl text-xs font-bold border ${s===k2?cls:'border-line text-mute'} disabled:opacity-50">${n}</button>`).join('')}</div></div>`}).join('')}</div>
 ${cl?'<div class="grid grid-cols-2 gap-2 mt-4"><button data-a="report" class="bg-acc text-white font-bold rounded-2xl py-3">عرض التقرير</button><button data-a="reopen" class="border border-line text-mute rounded-2xl py-3">إعادة فتح</button></div>'
  :'<button data-a="close" class="w-full mt-4 bg-acc text-white font-bold rounded-2xl py-3.5">إغلاق الجلسة وإنشاء التقرير</button>'}`}

/* ---------- تقويم الكنيسة ---------- */
const CMN=['توت','بابه','هاتور','كيهك','طوبه','أمشير','برمهات','برمودة','بشنس','بؤونة','أبيب','مسرى','النسيء'];
function copOf(dt){const N=Math.floor(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/864e5)+2440588-1825030,st=y=>365*(y-1)+Math.floor(y/4);
 let y=Math.floor(N/365.25)+1;while(st(y+1)<=N)y++;while(st(y)>N)y--;const r=N-st(y);return{y,m:Math.floor(r/30)+1,d:r%30+1}}
function easterOf(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),dd=(d+e+114)%31+1;return new Date(y,m-1,dd+13,12)}
const FEASTS=[[1,1,'🌿 النيروز — رأس السنة القبطية'],[1,17,'✝️ عيد الصليب'],[4,29,'⭐ عيد الميلاد المجيد'],[5,6,'عيد ختان السيد المسيح'],[5,11,'💧 عيد الغطاس'],[6,8,'عيد دخول السيد المسيح الهيكل'],[7,29,'🕊️ عيد البشارة'],[9,24,'عيد دخول السيد المسيح أرض مصر'],[11,5,'عيد الرسل'],[12,13,'⛰️ عيد التجلي'],[12,16,'👑 عيد صعود جسد السيدة العذراء']];
const FASTS=[[3,16,4,28,'🥣 صوم الميلاد'],[12,1,12,15,'🥣 صوم السيدة العذراء']];
function calEvents(from,to){const ev=[],cs=[],ext=new Date(to);ext.setDate(ext.getDate()+60);
 for(let t=new Date(from);t<=ext;t.setDate(t.getDate()+1)){const c=new Date(t);c.setHours(12,0,0,0);cs.push([c,copOf(c)])}
 const find=(m,d,after)=>cs.find(([dt,c])=>c.m===m&&c.d===d&&dt>after);
 cs.forEach(([dt,c])=>{FEASTS.forEach(([m,d,n])=>{if(c.m===m&&c.d===d)ev.push({dt,n,k:'feast'})});
  FASTS.forEach(([m1,d1,m2,d2,n])=>{if(c.m===m1&&c.d===d1){const e=find(m2,d2,dt);ev.push({dt,n,k:'fast',end:e?e[0]:null})}})});
 for(let y=from.getFullYear();y<=to.getFullYear()+1;y++){const E=easterOf(y),add=(o,n,k,len)=>{const dt=new Date(E);dt.setDate(dt.getDate()+o);const e=len?new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+len-1,12):null;ev.push({dt,n,k,end:e})};
  add(-69,'🥣 صوم نينوى','fast',3);add(-55,'🥣 الصوم الكبير','fast',55);add(-7,'🌴 أحد الشعانين','feast');add(-2,'✝️ الجمعة العظيمة','feast');add(0,'🌅 عيد القيامة المجيد','feast');add(39,'☁️ عيد الصعود','feast');add(49,'🔥 عيد العنصرة','feast');
  const st=new Date(E);st.setDate(st.getDate()+50);ev.push({dt:st,n:'🥣 صوم الرسل',k:'fast',end:new Date(st.getFullYear(),6,11,12)})}
 (S.cal||[]).forEach(x=>{const y0=from.getFullYear();for(let y=y0;y<=to.getFullYear()+1;y++){const dt=new Date(x.yearly?y+x.date.slice(4):x.date+'T12:00');dt.setHours(12,0,0,0);ev.push({dt,n:'📌 '+x.title,k:'mine',id:x.id});if(!x.yearly)break}});
 return ev.filter(e=>e.dt<=to&&(e.dt>=from||(e.end&&e.end>=from))).sort((a,b)=>a-b||0).sort((a,b)=>a.dt-b.dt)}
const arD=d=>d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
function leftTxt(dt,now){const n=Math.round((dt-now)/864e5);return n<=0?'اليوم':n===1?'غدًا':'بعد '+n+' يوم'}

function yearInfo(sy){const a=sy+'-09-01',b=(sy+1)+'-08-31',rs=S.reports.filter(r=>r.date>=a&&r.date<=b).sort((x,y)=>x.date.localeCompare(y.date));

function fpData(){const r=lastR(),ids=new Set([...(r?r.absIds||[]:[]),...needFu().map(x=>x.m.id)]),ms=[...ids].map(findM).filter(Boolean).sort((a,b)=>streak(b)-streak(a)),sv=S.servants||[],load={},out={},un=[];

 ms.forEach(m=>{let c=sv.filter(x=>x.name&&m.servant&&(x.name.includes(m.servant)||m.servant.includes(x.name)));if(!c.length)c=sv.filter(x=>x.sid===m.sid);if(!c.length){un.push(m);return}
  c.sort((a,b)=>load[a.id]-load[b.id]);out[c[0].id].push(m);load[c[0].id]++});
 return{ms,out,un,sv,r}}

function qrImg(t){const q=qrcode(0,'M');q.addData(t);q.make();return q.createDataURL(6,0)}
function vQR(){const sf=ui.qsf||'all',n=S.members.filter(m=>sf==='all'||m.sid===sf).length;
 return `<div class="space-y-3"><div class="${card} !mt-0"><h2 class="font-bold">كارت QR لكل مخدوم</h2><p class="text-sm text-mute mt-1">اطبع الكروت مرة واحدة، وكل مخدوم يعدّي بكارته على كاميرا الخادم فيتسجل حاضر في جلسة النهارده.</p></div>

async function qrStart(){const st=$('#qrs');if(!('BarcodeDetector' in window)){st.textContent='الكاميرا مش بتدعم قراءة الكود هنا — اكتب الكود يدويًا أو افتح من كروم';return}
 try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('#qrv');v.srcObject=stream;await v.play();QS={stream,last:'',t:0};st.textContent='جاهز — وجّه الكاميرا';const det=new BarcodeDetector({formats:['qr_code']});
  QS.iv=setInterval(async()=>{try{const r=await det.detect(v);if(r[0]){const c=r[0].rawValue.trim();if(c!==QS.last||Date.now()-QS.t>3000){QS.last=c;QS.t=Date.now();qrMark(c)}}}catch(_){}},350)}
 catch(_){st.textContent='تعذّر تشغيل الكاميرا — اسمح بالكاميرا من إعدادات المتصفح'}}
function qrStop(){if(QS){clearInterval(QS.iv);QS.stream.getTracks().forEach(t=>t.stop());QS=null}}
function qrMark(c){const m=findM(c);if(!m)return toast('كود غير معروف');if(closedToday())return toast('الجلسة مقفولة النهارده');const d=day(),was=d[m.id];d[m.id]='p';save();render();try{navigator.vibrate(80)}catch(_){}
 const l=$('#qrl');if(l)l.insertAdjacentHTML('afterbegin',`<div class="text-ok">✓ ${esc(m.name)}${was==='p'?' (كان حاضر)':''}</div>`)}
(function(){const go=()=>{const s=$('#sheet');if(s)new MutationObserver(()=>{if(s.classList.contains('hidden'))qrStop()}).observe(s,{attributes:true,attributeFilter:['class']})};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',go):go()})();

const PAPMAX=10;let PAPC={},PURLS=[];
function papDB(){return new Promise((res,rej)=>{const r=indexedDB.open('kenisty_papers',1);r.onupgradeneeded=()=>{const s=r.result.createObjectStore('p',{keyPath:'id'});s.createIndex('lid','lid')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function papAll(lid){const d=await papDB();return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').index('lid').getAll(lid);q.onsuccess=()=>res((q.result||[]).sort((a,b)=>a.t-b.t));q.onerror=()=>rej(q.error)})}
async function papGet(id){const d=await papDB();return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function papPut(o){const d=await papDB();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function papDel(id){const d=await papDB();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function papCounts(){const d=await papDB();return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').getAll();q.onsuccess=()=>{const c={};(q.result||[]).forEach(p=>c[p.lid]=(c[p.lid]||0)+1);res(c)};q.onerror=()=>rej(q.error)})}
function papShrink(file,max=1280,q=.72){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q)};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
async function papRefresh(lid){try{PAPC=await papCounts()}catch(_){}render();if(lid&&!$('#sheet').classList.contains('hidden'))papSheet(lid)}

 if(!n)return `<div class="rounded-2xl p-5 mt-3 bg-gradient-to-br from-acc/80 to-[#0c111b] border border-line"><div class="font-extrabold text-lg">أهلًا بك 👋 ابدأ من هنا</div><ol class="text-sm mt-2 space-y-1 list-decimal ps-5"><li>أضف المخدومين (أو الصق قائمة أسماء)</li><li>سجّل الحضور كل أسبوع</li><li>افتقد الغايبين وتابع التقارير</li></ol><div class="grid grid-cols-2 gap-2 mt-3"><button data-t="mem" class="bg-white text-slate-900 font-bold rounded-xl py-2.5">أضف المخدومين</button><button data-go="help" class="border border-white/40 rounded-xl py-2.5 font-bold">شرح البرنامج</button></div></div>`;
 return `<div class="grid grid-cols-4 gap-2 mt-3">${tile('mem',n,'المخدومين','text-slate-100')}${tile('att',last?last.rate+'%':'—','آخر حضور',last?tone(last.rate)[0]:'text-mute')}${tile('att',c.p+c.l,'حاضر اليوم','text-ok')}${tile('ntf',al,'تنبيهات عاجلة',al?'text-bad':'text-mute')}</div>
 <div class="rounded-2xl p-4 mt-3 bg-gradient-to-br from-acc to-acc/60"><div class="font-extrabold text-lg text-white">بدء التحضير الأسبوعي</div><div class="text-sm text-white/90">سجّل حضور اليوم بسرعة وسهولة</div><button data-t="att" class="mt-3 bg-white text-slate-900 font-bold rounded-xl px-5 py-2.5">${closedToday()?'عرض كشف اليوم':'افتح كشف الحضور'}</button></div>`}

/* --- أعياد الميلاد حسب الفترة (مخدومين + خدام) --- */
function bdList(f,t){const out=[],add=(x,kind)=>{if(!x.bd||!/^\d\d-\d\d$/.test(x.bd))return;
  [f.getFullYear(),f.getFullYear()+1].forEach(y=>{const d=new Date(y,+x.bd.slice(0,2)-1,+x.bd.slice(3),12);if(d>=f&&d<=t)out.push({x,d,kind})})};
 S.members.forEach(m=>add(m,'m'));S.servants.forEach(s=>add(s,'s'));return out.sort((a,b)=>a.d-b.d)}
function bdRange(){const p=ui.bdp||'30',t0=new Date(REAL+'T00:00'),n={'7':7,'30':30,'60':60,'90':90}[p];
 return p==='c'?{f:new Date((ui.bdf||REAL)+'T00:00'),t:new Date((ui.bdt||ui.bdf||REAL)+'T23:59')}:{f:t0,t:new Date(t0.getTime()+n*864e5+864e5-1)}}
const dm=d=>d.toLocaleDateString('ar-EG',{day:'numeric',month:'long'});
function vBd(){const p=ui.bdp||'30',{f,t}=bdRange(),L=bdList(f,t);
 return `<div class="flex gap-2 overflow-x-auto pb-2 -mx-4 px-4">${[['7','أسبوع'],['30','شهر'],['60','شهرين'],['90','٣ شهور'],['c','فترة تختارها']].map(([k,l])=>`<button data-sv="bdp" data-k="${k}" class="shrink-0 px-4 py-1.5 rounded-full text-sm border ${p===k?'bg-acc border-acc text-white font-bold':'border-line text-mute bg-card'}">${l}</button>`).join('')}</div>
 ${p==='c'?`<div class="grid grid-cols-2 gap-2 mt-2"><label class="text-xs text-mute">من<input type="date" id="bdf" value="${ui.bdf||REAL}" class="${inp}"></label><label class="text-xs text-mute">إلى<input type="date" id="bdt" value="${ui.bdt||ui.bdf||REAL}" class="${inp}"></label></div>`:''}
 <p class="text-xs text-mute mt-2">${L.length} عيد ميلاد من ${dm(f)} إلى ${dm(t)}</p>
 <div class="${card}">${L.map(({x,d,kind})=>`<div class="flex items-center gap-3 py-2 border-b border-line last:border-0">${avatar(x)}<div class="min-w-0 flex-1"><div class="font-bold truncate">${esc(x.name)}</div><div class="text-xs text-mute">${d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})} · ${kind==='s'?esc(x.role||'خادم'):esc(svcName(x.sid))}</div></div><a target="_blank" rel="noopener" href="${bdWa(x)}" class="text-xs text-ok border border-ok/40 rounded-lg px-3 py-1.5 ${x.phone?'':'opacity-30 pointer-events-none'}">تهنئة</a></div>`).join('')||'<p class="text-sm text-mute py-4">لا توجد أعياد ميلاد في هذه الفترة. تأكد من تسجيل تاريخ الميلاد في ملف كل شخص.</p>'}</div>
 ${L.length?'<button data-sv="bdshare" class="w-full mt-3 bg-ok text-white font-bold rounded-xl py-3">مشاركة القائمة على واتساب</button>':''}`}
function bdShareText(){const {f,t}=bdRange(),L=bdList(f,t);
 return '🎂 أعياد الميلاد من '+dm(f)+' إلى '+dm(t)+'\n\n'+L.map(({x,d})=>'• '+x.name+' — '+d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})).join('\n')+'\n\nكنيستي القبطية 3'}

/* --- سجل حضور كل شخص (يظهر في ملف المخدوم وزرار سجل الخادم) --- */
const stLabel={p:['حاضر','text-ok'],l:['متأخر','text-warn'],a:['غايب','text-bad'],e:['معتذر','text-sky-400']};
const histRows=(map,id)=>Object.keys(map).filter(d=>map[d][id]).sort().reverse().map(d=>[d,map[d][id]]);
function histBlock(map,id){const r=histRows(map,id),n={p:0,l:0,a:0,e:0};r.forEach(([,v])=>n[v]++);const den=n.p+n.l+n.a,pc=den?Math.round((n.p+n.l)/den*100):null;
 return `<div class="${card}"><h2 class="font-bold mb-1">سجل الحضور</h2>${r.length?`<div class="grid grid-cols-4 gap-2 mt-2 text-center text-xs">${[['حاضر',n.p,'text-ok'],['متأخر',n.l,'text-warn'],['غايب',n.a,'text-bad'],['معتذر',n.e,'text-sky-400']].map(([l,v,c])=>`<div class="bg-bg rounded-xl py-2"><b class="text-base ${c}">${v}</b><br>${l}</div>`).join('')}</div><div class="text-xs text-mute mt-2">نسبة الحضور ${pc===null?'—':pc+'%'}</div><div class="mt-2 max-h-56 overflow-y-auto">${r.map(([d,v])=>`<div class="flex justify-between py-1.5 border-b border-line last:border-0 text-sm"><span>${arDate(new Date(d+'T12:00'))}</span><span class="font-bold ${stLabel[v][1]}">${stLabel[v][0]}</span></div>`).join('')}</div>`:'<p class="text-sm text-mute">لا يوجد حضور مسجّل بعد</p>'}</div>`}
function svHist(id){const x=svFind(id);if(!x)return;
 $('#sb').innerHTML=`<div class="max-h-[84vh] overflow-y-auto"><div class="flex items-center gap-3">${avatar(x)}<div><div class="font-extrabold">${esc(x.name)}</div><div class="text-xs text-mute">${roleTag(x)}</div></div></div>${histBlock(S.vsess,id)}</div>`;$('#sheet').classList.remove('hidden')}

/* --- تقرير الافتقاد: اتصالات وزيارات الشهر + مين محتاج افتقاد --- */
const FUT=['اتصال','زيارة','واتساب','مقابلة','ملاحظة'];
function fuData(ym){const tot={},per={};FUT.forEach(t=>tot[t]=0);
 S.members.forEach(m=>(S.notes[m.id]||[]).forEach(n=>{const d=new Date(n.ts);if(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')!==ym)return;
  tot[n.type]=(tot[n.type]||0)+1;const r=per[m.id]=per[m.id]||{m,c:0,last:0};r.c++;r.last=Math.max(r.last,n.ts)}));
 return{tot,rows:Object.values(per).sort((a,b)=>b.c-a.c)}}
const needFu=()=>S.members.filter(m=>streak(m)>=2).map(m=>{const ns=S.notes[m.id]||[];return{m,k:streak(m),last:ns.length?Math.max(...ns.map(n=>n.ts)):0}}).sort((a,b)=>b.k-a.k||a.last-b.last);
function vFu(){const ym=ui.fm||REAL.slice(0,7),{tot,rows}=fuData(ym),all=FUT.reduce((a,t)=>a+tot[t],0),need=needFu();
 return `<input type="month" id="fmo" value="${ym}" max="${REAL.slice(0,7)}" aria-label="الشهر" class="${inp}">
 <div class="grid grid-cols-4 gap-2 mt-3">${['اتصال','زيارة','واتساب','مقابلة'].map(t=>stat(tot[t],t,'text-acc')).join('')}</div>
 <p class="text-xs text-mute mt-2">إجمالي الافتقاد في ${ymName(ym)}: <b>${all}</b>${tot['ملاحظة']?' (منها '+tot['ملاحظة']+' ملاحظة)':''}</p>
 <div class="${card}"><h2 class="font-bold mb-1">محتاجين افتقاد (غابوا جلستين أو أكتر)</h2>${need.map(({m,k,last})=>`<div data-m="${m.id}" class="flex items-center gap-3 py-2 border-b border-line last:border-0 cursor-pointer">${avatar(m)}<div class="min-w-0 flex-1"><div class="font-bold truncate">${esc(m.name)}</div><div class="text-xs text-mute">${last?'آخر افتقاد: '+dm(new Date(last)):'لم يُفتقد بعد'}</div></div><span class="text-xs px-2 py-0.5 rounded-full ${k>=3?'bg-bad/15 text-bad':'bg-warn/15 text-warn'}">غاب ${k}</span></div>`).join('')||'<p class="text-sm text-mute py-3">لا يوجد غياب متتالي حاليًا 🎉</p>'}</div>
 <div class="${card}"><h2 class="font-bold mb-1">اللي اتفتقدوا في ${ymName(ym)}</h2>${rows.map(r=>`<div data-m="${r.m.id}" class="flex items-center gap-3 py-2 border-b border-line last:border-0 cursor-pointer">${avatar(r.m)}<div class="flex-1 font-bold truncate">${esc(r.m.name)}</div><span class="text-sm"><b>${r.c}</b> مرة</span></div>`).join('')||'<p class="text-sm text-mute py-3">لا يوجد افتقاد مسجّل في هذا الشهر. سجّله من ملف المخدوم.</p>'}</div>
 <button data-sv="fushare" class="w-full mt-3 bg-ok text-white font-bold rounded-xl py-3">مشاركة التقرير على واتساب</button>`}
function fuText(){const ym=ui.fm||REAL.slice(0,7),{tot}=fuData(ym),need=needFu();
 return '🤝 تقرير الافتقاد — '+ymName(ym)+'\nاتصال: '+tot['اتصال']+' · زيارة: '+tot['زيارة']+' · واتساب: '+tot['واتساب']+' · مقابلة: '+tot['مقابلة']+'\n'+(need.length?'\nمحتاجين افتقاد:\n'+need.map(q=>'• '+q.m.name+' (غاب '+q.k+')').join('\n')+'\n':'')+'\nكنيستي القبطية 3'}

function vHelp(){const ho=ui.hopen;ui.hopen=null;const q=(t,a,k)=>`<details class="${card}" ${k&&ho===k?'open':''}><summary class="font-bold cursor-pointer">${t}</summary><div class="text-sm text-mute mt-2 leading-7">${a}</div></details>`;
 return `<p class="text-sm text-mute">اضغط على أي سؤال علشان يفتح الشرح.</p>`+
 q('البداية السريعة','١) من <b>المخدومين</b> اضغط + إضافة (أو الصق قايمة أسماء).<br>٢) من <b>الحضور</b> سجّل حاضر / متأخر / غايب / معتذر.<br>٣) اضغط <b>إغلاق الجلسة</b> علشان يتحدّث الحضور ويتعمل التقرير.')+

 q('الافتقاد والملاحظات','اضغط على اسم أي مخدوم: هتلاقي ملفه، وسجل حضوره، وقوالب واتساب، وخانة لتسجيل اتصال أو زيارة. وتقرير الافتقاد في «المزيد» بيوريك مين محتاج افتقاد.')+
 q('الخدام ونقاط الحضور','كارت «الخدام وحضورهم» في شاشة اليوم: أضف الخدام واختار الخدمة المسؤولين عنها وسجّل حضورهم. «نقاط الحضور»: ترتيب شهري (حاضر ٥ نقاط / متأخر ٣، وتتغيّر من الإعدادات).')+

 q('الشغل بدون إنترنت','كل حاجة بتتحفظ على موبايلك فورًا، وبتتزامن مع السيرفر لما النت يرجع. المؤشر فوق بيوضح الحالة.')+
 q('الأكواد وطلبات الانضمام (للمالك)','«👑 لوحة المالك» في المزيد: أكواد السنة، وقبول أو رفض طلبات الخدام الجداد. الرقم السري بتختاره أول مرة.')+
 q('👥 فريق الخدمة: خدام يشوفوا مخدوميهم','<b>الفكرة:</b> بتضيف خادم معاك، فيشوف مخدومين خدماته بس ويتصل بيهم، من غير ما يقدر يعدّل أو يمسح حاجة.<br><br><b>الخادم يعمل إيه؟</b><br>١) يعمل حساب ويدخل بكود الدعوة.<br>٢) يفتح «المزيد ← فريق الخدمة».<br>٣) يضغط «نسخ الكود» ويبعته لأمين الخدمة على واتساب.<br><br><b>أمين الخدمة يعمل إيه؟</b><br>١) يفتح «المزيد ← فريق الخدمة» ويضغط «+ إضافة خادم».<br>٢) يلصق الكود ويكتب اسم الخادم.<br>٣) يختار الخدمات اللي الخادم يشوفها (لو ما اختارش يشوف الكل) ويضغط حفظ.<br>٤) الخادم يقفل التطبيق ويفتحه تاني، فيظهر له شريط أزرق مكتوب فيه «وضع العرض فقط».<br><br><b>الخادم بيقدر:</b> يشوف مخدومين خدماته، ويتصل أو يبعت واتساب، ويشوف أعياد الميلاد والمحاضرات.<br><b>الخادم مش بيقدر:</b> يسجل حضور أو يعدّل أو يمسح. الحضور بيتسجل عند أمين الخدمة.<br><br><b>لإزالة خادم:</b> من نفس الشاشة اضغط «إزالة» جنب اسمه.<br><br><b>مرة واحدة بس (لصاحب التطبيق):</b> لو ظهرت رسالة «فعّل القواعد»، لازم تتضاف إعدادات في Firebase من ملف القواعد اللي اتسلّم معاك.','team')+
 q('🎓 المحاضرات','١) افتح «المزيد ← المحاضرات» واضغط «+ إضافة محاضرة» (الاسم واليوم والميعاد).<br>٢) اضغط «👥 الحضور» واختار الخدام والمخدومين اللي بيحضروها.<br>٣) تبويب «حسب الشخص» بيوريك كل واحد بيحضر أنهي أيام.<br>٤) لو كتبت ميعاد، بيجيلك تنبيه قبلها بساعة. وزرار «مشاركة» بيبعت القايمة على واتساب.','lect')+
 q('📷 كروت الحضور QR','١) افتح «المزيد ← كروت الحضور QR» واختار الخدمة واضغط «طباعة كروت» (محتاج نت مرة واحدة).<br>٢) كل مخدوم ياخد كارته.<br>٣) وقت الحضور اضغط «مسح للتحضير» ووجّه الكاميرا على الكارت، فيتسجل حاضر في جلسة النهارده.<br>بيشتغل في كروم على أندرويد، ولو الكاميرا مش شغالة اكتب الكود يدويًا.','qr')+
 q('🔔 الإشعارات والتذكيرات','<b>إشعارات الجهاز:</b> «المزيد ← إعدادات التنبيهات ← تفعيل إشعارات الجهاز»، وجرّب زرار «جرّب إشعار الآن». بتظهر لما تفتح التطبيق وأثناء فتحه.<br><b>تذكير والتطبيق مقفول:</b> من نفس الصفحة اختار التذكيرات ونزّل الملف وافتحه في تقويم الموبايل، والتقويم هو اللي بينبّهك في وقتها.','notif')+
 q('🗓️ خطة الافتقاد الأسبوعية','بتوزع المخدومين الغايبين على الخدام تلقائيًا: على الخادم المكتوب في ملف المخدوم، وإلا خادم نفس الخدمة، بالتساوي. كل مخدوم عليه زرار اتصال وواتساب، وتقدر تبعت لكل خادم قايمته على واتساب. ومن شاشة اليوم زرار «📨 رسالة افتقدناك» بيبعت لكل الغايبين رسالة جاهزة بالاسم.','fplan')+
 q('📆 التقرير السنوي','السنة الخدمية من سبتمبر لأغسطس. بيعرض متوسط الحضور وكل شهر وكل خدمة والأكثر مواظبة والأكثر غيابًا. تشاركه على واتساب أو تطبعه PDF. بيعتمد على الجلسات اللي اتقفلت.','year')+
 q('🖨️ ورقة الحضور المطبوعة','اختار الخدمة وعدد الأسابيع (٤ أو ٦ أو ٨) والتواريخ بتتكتب لوحدها، وممكن تضيف صور المخدومين. بعدها «طباعة / حفظ PDF». لو الطباعة مش شغالة داخل الـ APK افتح البرنامج من كروم.','print')+
 q('💾 النسخة الاحتياطية','«المزيد ← نسخة احتياطية»: نزّل ملف فيه كل بياناتك واحتفظ بيه (واتساب أو درايف). للاستعادة اختار الملف. نزّل نسخة كل أسبوعين على الأقل، وقبل أي مسح أو تسجيل خروج.','bak')+

 q('🏅 الشارات ورسم الحضور','في ملف المخدوم: 🔥 مواظب (٤ جلسات حضور متتالية)، 🌟 حضور كامل، 🎖️ ١٠ جلسات، 🏆 ٢٥ جلسة. وفيه رسم بياني بنسبة حضوره شهريًا. وفي ملفه كمان زرار 🎤 للإملاء الصوتي بدل الكتابة، وقايمة لنقله لخدمة تانية.','badges')+

 q('📷 أوراق المحاضرات (تصوير وحفظ)','<b>١)</b> «المزيد ← المحاضرات» واختار اليوم.<br><b>٢)</b> تحت المحاضرة اضغط «📷 الأوراق».<br><b>٣)</b> «📷 تصوير» يفتح الكاميرا، أو «🖼 من المعرض» تختار صور موجودة. الصورة بتتصغّر لوحدها عشان ما تاخدش مساحة.<br><b>٤)</b> اضغط على الصورة تكبّرها. «مشاركة» تبعتها واتساب أو أي برنامج، و«حذف» تمسحها.<br><br>أمين الخدمة والخادم الاتنين يقدروا يصوّروا.<br>الحد الأقصى ١٠ صور لكل محاضرة.<br><br><b>مهم تعرفه:</b><br>• الصور محفوظة على موبايلك <b>أنت بس</b>، ومش بتظهر لأمين الخدمة ولا لخادم تاني. عشان حد يشوفها ابعتها له واتساب بزرار «مشاركة».<br>• مش بتدخل في النسخة الاحتياطية، وبتضيع لو مسحت بيانات المتصفح أو غيّرت الموبايل.<br>• بتفضل على الجهاز حتى بعد تسجيل الخروج، فامسحها بنفسك لو الموبايل مش بتاعك لوحدك.','papers')+

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,GoogleAuthProvider,signInWithPopup,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,deleteDoc,getDoc,getDocs,updateDoc,query,where,collection,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyDAaBA-XOZpiwnS3uB8jYR8ECan_5G7fV8",authDomain:"kenisty-coptic-3.firebaseapp.com",projectId:"kenisty-coptic-3",storageBucket:"kenisty-coptic-3.firebasestorage.app",messagingSenderId:"910306888735",appId:"1:910306888735:web:da7b17e12240873471192a"});
const auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const Q=s=>document.querySelector(s);let last={},unsub=null,first=true;

/* نقسّم الحالة لمستندات صغيرة في users/{uid}/c (مساحة خاصة بكل مستخدم): meta / p / s_التاريخ / r_التاريخ / n_كود المخدوم */
const pack=s=>{const o={meta:{seq:s.seq,services:s.services,members:s.members,servants:s.servants||[],seqv:s.seqv||1},p:{pf:s.pf||{},plan:s.plan||{},lect:s.lect||[],cal:s.cal||[]}};
 Object.entries(s.sess||{}).forEach(([d,v])=>{if(Object.keys(v).length)o['s_'+d]=v});
 Object.entries(s.vsess||{}).forEach(([d,v])=>{if(Object.keys(v).length)o['v_'+d]=v});
 (s.reports||[]).forEach(r=>o['r_'+r.date]=r);
 Object.entries(s.notes||{}).forEach(([m,v])=>{if(v.length)o['n_'+m]=v});return o};

/* يرفع المستندات اللي اتغيرت بس، ويحذف اللي اتشالت */
FB.push=async snap=>{const ch=pack(snap),ops=[];
 for(const [id,v] of Object.entries(ch)){const j=JSON.stringify(v);if(last[id]!==j){last[id]=j;ops.push(setDoc(doc(db,'users',window.WSID||auth.currentUser.uid,'c',id),{j,t:serverTimestamp()}))}}
 for(const id of Object.keys(last))if(!(id in ch)){delete last[id];ops.push(deleteDoc(doc(db,'users',window.WSID||auth.currentUser.uid,'c',id)))}
 await Promise.all(ops)};

async function resolveWS(u){const ck='kenisty_ws_'+u.uid;let w=null;
 try{const l=await getDoc(doc(db,'links',u.uid));if(l.exists()&&l.data().owner&&l.data().owner!==u.uid){const o=l.data().owner,t=await getDoc(doc(db,'users',o,'team',u.uid));if(t.exists())w={o,s:t.data().sids||[],n:t.data().name||''}}localStorage.setItem(ck,JSON.stringify(w))}
 catch(_){try{w=JSON.parse(localStorage.getItem(ck)||'null')}catch(__){w=null}}
 window.WSID=w?w.o:u.uid;window.RO=!!w;window.TSIDS=w?w.s:null;document.body.classList.toggle('ro',!!w);
 let bar=document.getElementById('robar');if(w){if(!bar){bar=document.createElement('div');bar.id='robar';bar.className='np';bar.style.cssText='position:sticky;top:0;z-index:35;background:#0ea5e9;color:#fff;font-size:12px;text-align:center;padding:3px';document.body.prepend(bar)}bar.textContent='👁 وضع العرض فقط'+(w.n?' — '+w.n:'')}else if(bar)bar.remove();if(typeof updSync==='function')updSync()}
window.FBX={uid:()=>auth.currentUser&&auth.currentUser.uid,me:()=>auth.currentUser?{name:auth.currentUser.displayName||'',email:auth.currentUser.email||''}:null,
 async list(){const q=await getDocs(collection(db,'users',auth.currentUser.uid,'team'));return q.docs.map(d=>({id:d.id,...d.data()}))},
 async add(uid,o){const me=auth.currentUser.uid;await setDoc(doc(db,'users',me,'team',uid),o);await setDoc(doc(db,'links',uid),{owner:me})},
 async del(uid){const me=auth.currentUser.uid;await deleteDoc(doc(db,'users',me,'team',uid));try{await deleteDoc(doc(db,'links',uid))}catch(_){}}};
function load(snap){const docs=[];snap.forEach(d=>docs.push([d.id,d.data().j]));
 if(!docs.length){                                   // قاعدة البيانات فاضية: أول تشغيل
  if(first){{S.members=[];S.sess={};S.reports=[];S.notes={};S.services=[{id:'s1',name:'الفصل الأول'}];S.seq=1;S.servants=[];S.vsess={};S.seqv=1;S.lect=S.lect||[]}
   S.dirty=true;first=false;sync()}return}
 if(S.dirty&&!first)return;                          // عندي تعديلات لسه ما اترفعتش
 const n={seq:S.seq,services:S.services,members:S.members,servants:[],seqv:1,vsess:{},sess:{},notes:{},reports:[],pf:S.pf,plan:S.plan,lect:S.lect||[],cal:S.cal||[]};
 docs.forEach(([id,j])=>{const v=JSON.parse(j);last[id]=j;
  if(id==='meta'){n.seq=v.seq;n.services=v.services;n.members=v.members;n.servants=v.servants||[];n.seqv=v.seqv||1}
  else if(id==='p'){n.pf=v.pf;n.plan=v.plan;n.lect=v.lect||[];n.cal=v.cal||[]}
  else if(id.startsWith('s_'))n.sess[id.slice(2)]=v;
  else if(id.startsWith('r_'))n.reports.push(v);
  else if(id.startsWith('v_'))n.vsess[id.slice(2)]=v;
  else if(id.startsWith('n_'))n.notes[id.slice(2)]=v});
 n.reports.sort((a,b)=>a.date.localeCompare(b.date));if(window.RO)roFilter(n);Object.assign(S,n);S.dirty=false;
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}
 first=false;updSync();render()}

/* ===== كود الدعوة: العضوية تُسجَّل مرة واحدة في members/{uid}، والقواعد تقارن الكود بـ config/invite ===== */
let pendingCode='';const memKey=id=>'kenisty_member_'+id,H=(s,on)=>Q(s).classList.toggle('hidden',!on);
async function checkMember(u,code){
 if(localStorage.getItem(memKey(u.uid))==='1')return true;           // اتأكد قبل كده (يشتغل أوفلاين)
 const ref=doc(db,'members',u.uid);
 try{if((await getDoc(ref)).exists()){localStorage.setItem(memKey(u.uid),'1');return true}}
 catch(_){if(!navigator.onLine)return 'offline'}
 if(code){try{await setDoc(ref,{code,t:serverTimestamp()});localStorage.setItem(memKey(u.uid),'1');return true}
  catch(_){return navigator.onLine?'bad':'offline'}}
 return 'need';
}
async function enter(u,code){
 const adm=await checkAdmin(u);const r=adm?true:await checkMember(u,code);
 if(r===true){unsubM?.();unsubR?.();H('#login',0);H('#gate',0);first=true;last={};unsub?.();
  await resolveWS(u);unsub=onSnapshot(collection(db,'users',window.WSID||u.uid,'c'),load,()=>toast('تعذّر الاتصال بالسيرفر'));return}
 if(r==='offline'){H('#login',0);H('#gate',0);toast('بدون إنترنت - بيانات الموبايل فقط');return}   // لا نمنع الاستخدام أوفلاين
 H('#login',0);H('#gate',1);
 Q('#gerr').textContent=r==='bad'?'الكود غير صحيح أو انتهت صلاحيته':'';
 try{if((await getDoc(doc(db,'requests',u.uid))).exists())watchApproval(u)}catch(_){}
}
onAuthStateChanged(auth,u=>{unsub?.();unsub=null;
 if(u){const c=pendingCode;pendingCode='';enter(u,c)}
 else{window.IS_ADMIN=false;closeOwner();H('#gate',0);H('#login',1)}});
addEventListener('online',()=>{if(auth.currentUser&&!unsub)enter(auth.currentUser,'')});

Q('#go').onclick=async()=>{await signOut(auth);try{localStorage.removeItem(KEY)}catch(_){}location.reload()};
/* ===== طلبات الانضمام + لوحة المالك (تظهر فقط لحساب موجود في admins) ===== */

async function checkAdmin(u){const k='kenisty_admin_'+u.uid;let a=localStorage.getItem(k)==='1';
 try{a=(await getDoc(doc(db,'admins',u.uid))).exists();localStorage.setItem(k,a?'1':'0')}catch(_){}

 unsubM?.();unsubR?.();

 unsubR=onSnapshot(doc(db,'requests',u.uid),s=>{const d=s.data()||{};
  Q('#gstat').textContent=d.status==='rejected'?'تم رفض الطلب. كلّم أمين الخدمة.':'طلبك قيد المراجعة... هيفتح لك البرنامج لما يتم قبولك'},()=>{})}

 watchApproval(u)}

const pinKey=id=>'kenisty_pin_'+id,tryKey=id=>'kenisty_pinx_'+id;

const weak=p=>/^(\d)\1{5}$/.test(p)||'01234567890'.includes(p)||'09876543210'.includes(p)||['123123','112233','121212','111222'].includes(p);

function ownerSet(m=''){shell(`<div class="${cd}"><h2 class="font-bold mb-1">اختر رقمك السري</h2><p class="text-xs text-mute mb-3">٦ أرقام مميزة. بلاش تاريخ ميلادك ولا ١٢٣٤٥٦.</p><input id="p1" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" class="${ob}"><input id="p2" type="password" inputmode="numeric" maxlength="6" placeholder="أعد كتابته" class="${ob} mt-2"><div class="text-bad text-sm mt-2 min-h-[1.25rem]">${m}</div><button data-oa="setpin" class="w-full mt-2 bg-acc text-white font-bold rounded-xl py-3">حفظ</button></div>`)}
function ownerLock(m=''){shell(`<div class="${cd}"><h2 class="font-bold mb-3">اكتب الرقم السري</h2><input id="p1" type="password" inputmode="numeric" maxlength="6" class="${ob}"><div class="text-bad text-sm mt-2 min-h-[1.25rem]">${m}</div><button data-oa="unlock" class="w-full mt-2 bg-acc text-white font-bold rounded-xl py-3">فتح</button><p class="text-[11px] text-mute mt-3">نسيت الرقم؟ امسح بيانات الموقع من إعدادات المتصفح وسجّل دخول تاني، وتختار رقم جديد.</p></div>`)}
async function doUnlock(){const u=auth.currentUser,p=Q('#p1').value.trim(),tk=tryKey(u.uid);let t={n:0,until:0};
 try{t=JSON.parse(localStorage.getItem(tk))||t}catch(_){}
 if(Date.now()<t.until)return ownerLock('محاولات كتير. جرّب بعد '+Math.ceil((t.until-Date.now())/6e4)+' دقيقة');
 if(await sha(u.uid+':'+p)===localStorage.getItem(pinKey(u.uid))){localStorage.removeItem(tk);ownerMain()}
 else{t.n++;if(t.n>=5)t={n:0,until:Date.now()+3e5};localStorage.setItem(tk,JSON.stringify(t));ownerLock('الرقم غير صحيح')}}
async function ownerMain(){shell('<p class="text-mute text-sm">جاري التحميل…</p>');
 try{const s=await getDoc(doc(db,'config','invite'));odata.inv=s.exists()?s.data():{};
  const q=await getDocs(query(collection(db,'requests'),where('status','==','pending')));odata.req=q.docs.map(d=>({id:d.id,...d.data()}))}
 catch(_){return shell('<p class="text-bad text-sm">تعذّر التحميل. اتأكد من النت ومن إضافة حسابك في admins.</p>')}
 ownerView()}
function ownerView(){const inv=odata.inv||{},cs=inv.codes||[],ix=inv.idx??0,rq=odata.req||[],tb=(k,l)=>`<button data-oa="tab" data-t="${k}" class="py-2 rounded-xl text-sm font-bold border ${otab===k?'bg-acc border-acc text-white':'border-line text-mute bg-card'}">${l}</button>`;
 let body='';
 if(otab==='codes'){
  body=(inv.code?`<div class="${cd} text-center"><div class="text-xs text-mute">الكود الحالي</div><div class="text-3xl font-extrabold font-mono tracking-widest my-2" dir="ltr">${esc(inv.code)}</div><div class="grid grid-cols-2 gap-2"><button data-oa="copy" class="border border-line rounded-xl py-2.5 text-sm font-bold">نسخ</button><button data-oa="wa" class="bg-ok text-white rounded-xl py-2.5 text-sm font-bold">إرسال واتساب</button></div></div>`:`<div class="${cd} text-sm text-mute">لا توجد أكواد بعد. اضغط "أنشئ أكواد السنة".</div>`)
  +(cs.length?`<div class="${cd}"><h2 class="font-bold mb-1">أكواد السنة</h2>${cs.map((c,i)=>`<div class="flex items-center gap-3 py-2 border-b border-line last:border-0"><div class="flex-1"><div class="text-xs text-mute">${mlabel(inv.since||ymNow(),i*2)}</div><div class="font-mono font-bold" dir="ltr">${esc(c)}</div></div>${i===ix?'<span class="text-xs text-ok font-bold">الحالي ✓</span>':`<button data-oa="act" data-i="${i}" class="text-xs text-acc border border-acc/40 rounded-lg px-3 py-1.5">تفعيل</button>`}</div>`).join('')}<button data-oa="next" class="w-full mt-3 bg-acc text-white font-bold rounded-xl py-2.5 ${ix>=cs.length-1?'opacity-40':''}">فعّل الكود التالي</button></div>`:'')
  +`<button data-oa="gen" class="w-full mt-3 border border-line rounded-xl py-3 text-sm font-bold">${cs.length?'أنشئ أكواد جديدة (تستبدل الحالية)':'أنشئ أكواد السنة'}</button><p class="text-[11px] text-mute mt-2">تغيير الكود يمنع الدخول بالكود القديم للخدام الجداد فقط. الخدام الحاليين لا يتأثرون.</p>`}
 else body=rq.length?`<div class="grid grid-cols-2 gap-2 mb-3"><button data-oa="rejall" class="border border-bad/50 text-bad rounded-xl py-2.5 text-sm font-bold">رفض الكل (${rq.length})</button><button data-oa="delall" class="border border-line rounded-xl py-2.5 text-sm font-bold">مسح الكل</button></div>`+rq.map(r=>`<div class="${cd}"><div class="font-bold">${esc(r.name||'بدون اسم')}</div><div class="text-xs text-mute" dir="ltr">${esc(r.email)}</div><div class="grid grid-cols-2 gap-2 mt-3"><button data-oa="ok" data-u="${r.id}" class="bg-ok text-white rounded-xl py-2.5 font-bold">قبول</button><button data-oa="no" data-u="${r.id}" class="border border-bad/50 text-bad rounded-xl py-2.5 font-bold">رفض</button></div></div>`).join(''):`<p class="text-center text-mute py-10">لا توجد طلبات انضمام<br><span class="text-xs">الطلب بيظهر لما خادم جديد يضغط «أرسل طلب انضمام» من شاشة الكود. اضغط ↻ للتحديث.</span></p>`;
 shell(`<div class="grid grid-cols-2 gap-2">${tb('codes','الأكواد')}${tb('req','الطلبات'+(rq.length?' ('+rq.length+')':''))}</div>${body}`)}
async function saveInv(o){await setDoc(doc(db,'config','invite'),{...o,t:serverTimestamp()},{merge:true});odata.inv={...odata.inv,...o};ownerView()}
O().addEventListener('click',async e=>{const b=e.target.closest('[data-oa]');if(!b)return;const a=b.dataset.oa,u=auth.currentUser,inv=odata.inv||{},cs=inv.codes||[];
 try{
 if(a==='close')closeOwner();
 else if(a==='refresh')ownerMain();
 else if(a==='setpin'){const p=Q('#p1').value.trim(),q=Q('#p2').value.trim();
  if(!/^\d{6}$/.test(p))return ownerSet('لازم ٦ أرقام');if(weak(p))return ownerSet('الرقم سهل التخمين، اختار رقم مميز');if(p!==q)return ownerSet('الرقمين مش متطابقين');
  localStorage.setItem(pinKey(u.uid),await sha(u.uid+':'+p));ownerMain()}
 else if(a==='unlock')doUnlock();
 else if(a==='tab'){otab=b.dataset.t;ownerView()}
 else if(a==='gen'){if(cs.length&&!confirm('هذا يستبدل كل الأكواد والكود الحالي. متأكد؟'))return;const c=Array.from({length:6},gen);await saveInv({codes:c,idx:0,code:c[0],since:ymNow()});toast('تم إنشاء الأكواد')}
 else if(a==='act'){const i=+b.dataset.i;await saveInv({idx:i,code:cs[i]});toast('تم تفعيل الكود')}
 else if(a==='next'){const i=(inv.idx??0)+1;if(i>=cs.length)return toast('ده آخر كود في القائمة');await saveInv({idx:i,code:cs[i]});toast('تم تفعيل الكود التالي')}
 else if(a==='copy'){await navigator.clipboard.writeText(inv.code);toast('تم نسخ الكود')}
 else if(a==='wa')window.open('https://wa.me/?text='+encodeURIComponent('سلام ونعمة 🙏\nرابط البرنامج: '+location.origin+location.pathname+'\nكود الدعوة: '+inv.code+'\nاكتبه مرة واحدة عند أول دخول.'),'_blank','noopener');
 else if(a==='rejall'||a==='delall'){const l=odata.req||[];if(!l.length)return;
  if(!confirm(a==='rejall'?'رفض كل الطلبات المعلقة ('+l.length+')؟ هيظهر لأصحابها إنها اترفضت.':'مسح كل الطلبات المعلقة ('+l.length+') نهائيًا؟'))return;
  for(const r of l){if(a==='rejall')await updateDoc(doc(db,'requests',r.id),{status:'rejected'});else await deleteDoc(doc(db,'requests',r.id))}
  odata.req=[];ownerView();toast(a==='rejall'?'تم رفض الكل':'تم مسح الطلبات')}
 else if(a==='ok'||a==='no'){const id=b.dataset.u;
  if(a==='ok')await setDoc(doc(db,'members',id),{by:'admin',t:serverTimestamp()});
  await updateDoc(doc(db,'requests',id),{status:a==='ok'?'approved':'rejected'});
  odata.req=(odata.req||[]).filter(x=>x.id!==id);ownerView();toast(a==='ok'?'تم القبول':'تم الرفض')}
 }catch(_){toast('تعذّر التنفيذ، اتأكد من النت وصلاحيات المالك')}});

 try{await sendPasswordResetEmail(auth,m);msg('تم إرسال رابط تغيير الباسورد لإيميلك',1)}catch(_){msg('تعذّر الإرسال، راجع الإيميل')}};

<script>
/* Service worker registration + offline helpers */
if ('serviceWorker' in navigator) {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { scope: './' });
      reg.addEventListener('updatefound', () => {                 // a new version was deployed
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'activated' && navigator.serviceWorker.controller) toast('تحديث جديد جاهز - أغلق التطبيق وافتحه');
        });
      });
      const ready = await navigator.serviceWorker.ready;           // cache what this first visit loaded
      ready.active && ready.active.postMessage({ type: 'CACHE_URLS', urls: performance.getEntriesByType('resource').map(r => r.name) });
    } catch (_) {}
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();   // ask the browser not to evict our data
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });   // retry sync when the app returns to front
  setInterval(() => { if (navigator.onLine) sync(); }, 60000);                                // and once a minute while open
}
</script>
